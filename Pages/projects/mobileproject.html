<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!--title-->
<!--og:meta-->
<link rel="apple-touch-icon" href="/images/icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root { --bg: #222; --card: #2a2a2a; --text: #fff; --accent: #00e676; --line: rgba(255, 255, 255, 0.08); --muted: rgba(255, 255, 255, 0.6); --mention: #ffb6d9;}
html[data-theme="light"] { --bg: #f2f2f2; --card: #fff; --text: #111; --accent: #00a152; --line: rgba(0, 0, 0, 0.08); --muted: rgba(0, 0, 0, 0.55); --mention: #e5679f;}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font-family: sans-serif; overflow-wrap: anywhere; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
a { color: var(--accent); text-decoration: none; }
button { font-family: inherit; color: var(--text); -webkit-tap-highlight-color: transparent; }
input, textarea { font-size: 16px; }

.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: var(--card); border-bottom: 1px solid var(--line); touch-action: pan-y; }
.top h1 { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 36px; height: 36px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; background: none; border: 0; }
.icon-btn svg { width: 24px; height: 24px; }

.stage { position: relative; width: 100%; aspect-ratio: var(--ar, 4 / 3); background: #000; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.stage.full { position: fixed; inset: 0; z-index: 100; height: 100%; aspect-ratio: auto; }
.exit-full { display: none; position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; z-index: 2; padding: 6px 14px; border: 0; border-radius: 15px; background: rgba(0, 0, 0, 0.65); color: #fff; font-weight: bold; }
.stage.is-fs .exit-full { display: block; }
.pad { display: none; position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.stage.touch-ui .pad { display: block; }
.pad, .pad * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.joy, .pad-right, .keypick { pointer-events: auto; }
.joy { position: absolute; left: calc(24px + env(safe-area-inset-left)); bottom: calc(24px + env(safe-area-inset-bottom)); width: 140px; height: 140px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255, 255, 255, 0.3); }
.knob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: rgba(255, 255, 255, 0.45); }
.pad-right { position: absolute; right: calc(20px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 14px; }
.custom-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pad-btn { width: 88px; height: 88px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.15); color: #fff; font-size: .85rem; font-weight: bold; }
.pad-btn.small { width: 64px; height: 64px; }
.pad-btn.down { background: var(--accent); border-color: var(--accent); color: #111; }
.gear { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; }
.gear svg { width: 16px; height: 16px; }
.keypick { display: none; position: absolute; right: 12px; bottom: calc(150px + env(safe-area-inset-bottom)); width: min(300px, 75%); max-height: 55%; overflow-y: auto; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 10px; border-radius: 14px; background: rgba(0, 0, 0, 0.88); }
.keypick, .keypick * { touch-action: pan-y; }
.keypick.open { display: grid; }
.keypick button { padding: 8px 0; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.1); color: #fff; font-size: .8rem; }
.keypick button.sel { background: var(--accent); border-color: var(--accent); color: #111; }
.c-actions button.on { color: var(--accent); opacity: 1; }

.actions, .info, .comments { touch-action: pan-y; }
.actions { display: flex; gap: 8px; padding: 10px 12px; }
.actions button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: .85rem; font-weight: 600; }
.actions button svg { width: 18px; height: 18px; }
.actions button.on svg { fill: #ff4d6d; color: #ff4d6d; }

.info, .comments { padding: 6px 12px 14px; }
.title { font-size: 1.35rem; line-height: 1.25; }
.byline { font-size: .85rem; color: var(--muted); margin: 4px 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { padding: 3px 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: .72rem; }
.chip.accent { color: var(--accent); }
.desc { font-size: .95rem; line-height: 1.5; margin-bottom: 14px; }
.desc a, .c-body a, .mention { color: var(--mention); }
.mention { font-weight: 600; }
.stats { display: flex; justify-content: space-around; padding: 12px 0; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.stats div { display: flex; flex-direction: column; align-items: center; }
.stats strong { font-size: 1.15rem; }
.stats span { font-size: .7rem; color: var(--muted); }
.btn { display: block; width: 100%; padding: 12px; border-radius: 14px; border: 0; background: var(--accent); color: #111; font-size: 1rem; font-weight: bold; text-align: center; margin-bottom: 8px; }
.btn.alt { background: var(--card); color: var(--text); border: 1px solid var(--line); }
.btn.danger { color: #ff6b6b; }

.comments h2 { font-size: 1.1rem; color: var(--accent); margin: 8px 0 10px; }
.comment { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.c-head { display: flex; justify-content: space-between; gap: 8px; font-size: .78rem; margin-bottom: 4px; }
.c-head span { color: var(--muted); }
.c-body { font-size: .92rem; line-height: 1.4; }
.c-actions { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: .8rem; color: var(--muted); }
.c-actions button { background: none; border: 0; padding: 4px; display: flex; opacity: .75; }
.c-actions svg { width: 18px; height: 18px; }
.c-actions .del { margin-left: auto; }
.form textarea { width: 100%; min-height: 90px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); outline: 0; background: var(--card); color: var(--text); font-family: inherit; resize: vertical; }
.form .btn { margin: 8px 0 0; }
.status { color: var(--muted); font-size: .9rem; padding: 14px 0; text-align: center; }
.msg { font-size: .85rem; margin-top: 6px; color: #ff6b6b; }
.c-wrap { position: relative; margin-bottom: 8px; border-radius: 12px; overflow: hidden; }
.c-wrap .comment { margin-bottom: 0; position: relative; transition: transform .2s ease; }
.reply-hint { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); opacity: 0; color: var(--accent); pointer-events: none; }
.reply-hint svg { width: 22px; height: 22px; }
.c-btn.active { color: var(--accent); opacity: 1; }
</style>
</head>
<body>
<header class="top">
  <button class="icon-btn" id="back" aria-label="Back"><i data-lucide="arrow-left"></i></button>
  <h1 id="top-title">Project</h1>
</header>
<div id="seo" hidden><!--content--></div>
<main id="app"><div class="status">Loading…</div></main>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="/Assets/scripts/script.js"></script>
<script>
const pid = location.pathname.split("/")[2];
const projectOwner = <!--project-owner-->;
const platforms = { cdo: "code.org", khan: "Khan Academy", scratch: "Scratch", embed: "Unknown", wk: "Watermelon Katana", swf: "Flash", editor: "Node Editor" };
let project = null;
const KEYS = {};
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(c => { KEYS["Key" + c] = { label: c, key: c.toLowerCase(), code: "Key" + c, keyCode: c.charCodeAt(0) }; });
"0123456789".split("").forEach(c => { KEYS["Digit" + c] = { label: c, key: c, code: "Digit" + c, keyCode: c.charCodeAt(0) }; });
Object.assign(KEYS, {
  Space: { label: "Space", key: " ", code: "Space", keyCode: 32 },
  ArrowUp: { label: "Up", key: "ArrowUp", code: "ArrowUp", keyCode: 38 },
  ArrowDown: { label: "Down", key: "ArrowDown", code: "ArrowDown", keyCode: 40 },
  ArrowLeft: { label: "Left", key: "ArrowLeft", code: "ArrowLeft", keyCode: 37 },
  ArrowRight: { label: "Right", key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
  Enter: { label: "Enter", key: "Enter", code: "Enter", keyCode: 13 },
  ShiftLeft: { label: "Shift", key: "Shift", code: "ShiftLeft", keyCode: 16 },
  ControlLeft: { label: "Ctrl", key: "Control", code: "ControlLeft", keyCode: 17 },
  Tab: { label: "Tab", key: "Tab", code: "Tab", keyCode: 9 },
  Escape: { label: "Esc", key: "Escape", code: "Escape", keyCode: 27 },
  Backspace: { label: "Back", key: "Backspace", code: "Backspace", keyCode: 8 }
});
const PAD_HTML = `
  <div class="pad">
    <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
    <div class="pad-right">
      <div class="custom-wrap">
        <button class="gear" id="pad-gear" type="button" aria-label="Change key"><i data-lucide="settings"></i></button>
        <button class="pad-btn small" id="pad-custom" type="button"></button>
      </div>
      <button class="pad-btn" id="pad-space" type="button">SPACE</button>
    </div>
    <div class="keypick" id="keypick"></div>
  </div>`;
let auth = { auth: false };

document.documentElement.dataset.theme = (() => {
  try { return localStorage.getItem("color-scheme") === "light" ? "light" : "dark"; } catch (err) { return "dark"; }
})();

const app = document.getElementById("app");

function esc(str) {
  return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function renderText(str) {
  const stash = [];
  const keep = html => "\u0000" + (stash.push(html) - 1) + "\u0000";
  const fmt = s => s
    .replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>")
    .replace(/__([\s\S]+?)__/g, "<u>$1</u>")
    .replace(/~~([\s\S]+?)~~/g, "<s>$1</s>")
    .replace(/\*([^\s*](?:[\s\S]*?[^\s*])?)\*/g, "<em>$1</em>");

  let s = esc(str);

  // [text](link), http(s) or site-relative links only
  s = s.replace(/\[([^\]\n]+)\]\(((?:https?:\/\/|\/)[^\s)]+)\)/g, (m, label, url) =>
    keep('<a href="' + url + '"' + (url[0] === "/" ? "" : ' target="_blank" rel="noopener"') + ">" + fmt(label) + "</a>"));

  // bare URLs
  s = s.replace(/(https?:\/\/[^\s<\u0000]+)/g, (m, url) =>
    keep('<a href="' + url + '" target="_blank" rel="noopener">' + url + "</a>"));

  // @mentions
  s = s.replace(/(^|[^\w@])@([\w-]{1,32})/g, (m, pre, name) =>
    pre + keep('<a class="mention" href="/user/' + encodeURIComponent(name) + '">@' + name + "</a>"));

  s = fmt(s).replace(/\n/g, "<br>");
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => stash[Number(i)]);
}
function timeAgo(t) {
  t = Number(t) || 0;
  if (!t) return "";
  const s = (Date.now() - t) / 1000;
  const units = [["year", 31557600], ["month", 2629800], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]];
  for (const [name, secs] of units) {
    const n = Math.floor(s / secs);
    if (n >= 1) return n + " " + name + (n > 1 ? "s" : "") + " ago";
  }
  return "just now";
}
function icons() {
  if (window.lucide) lucide.createIcons();
}
async function jsonRequest(method, path, body) {
  const res = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let data = {};
  try { data = await res.json(); } catch (err) {}
  if (res.status >= 400) throw new Error((data.message || "Something went wrong") + (data.error ? ". " + data.error : ""));
  return data;
}
function me() {
  return auth && auth.auth ? auth.user : null;
}

async function loadAuth() {
  try {
    const res = await fetch("/api/auth/check");
    auth = await res.json();
  } catch (err) {
    auth = { auth: false };
  }
}

async function load() {
  try {
    const [res] = await Promise.all([fetch("/api/project/data/" + encodeURIComponent(pid)), loadAuth()]);
    if (!res.ok) throw new Error("HTTP " + res.status);
    project = await res.json();
    renderPage();
    startGame();
    renderComments();
    renderCommentForm();
    setupOwner();
  } catch (err) {
    console.error(err);
    app.innerHTML = '<div class="status">Couldn\u2019t load this project (' + esc(err.message) + ').</div>';
  }
}

function renderPage() {
  const p = project;
  const u = me();
  const link = p.platform === "editor" ? location.origin + "/editor/project/" + pid + "/deployment" : p.link;
  const tags = (Array.isArray(p.tags) ? p.tags : []).map(t => `<span class="chip accent">#${esc(t)}</span>`).join("");
  document.getElementById("top-title").textContent = p.title || "Project";
  app.innerHTML = `
    <div class="stage" id="stage">
      <iframe id="game" allowfullscreen allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope"></iframe>
      <button class="exit-full" id="exit-full">Exit</button>
      ${p.platform === "cdo" ? PAD_HTML : ""}
    </div>
    <div class="actions">
      <button id="replay"><i data-lucide="rotate-ccw"></i>Replay</button>
      <button id="fullscreen"><i data-lucide="maximize"></i>Fullscreen</button>
      ${u ? '<button id="fav"><i data-lucide="heart"></i><span id="fav-text">Favorite</span></button>' : ""}
    </div>
    <section class="info">
      <h2 class="title">${esc(p.title || "Untitled")}</h2>
      <div class="byline">By <a href="/user/${encodeURIComponent(p.poster || "")}">${esc(p.poster || "unknown")}</a></div>
      <div class="chips"><span class="chip">${esc(platforms[p.platform] || "Unknown")}</span>${tags}</div>
      ${p.content ? `<div class="desc">${renderText(p.content)}</div>` : ""}
      <div class="stats">
        <div><strong id="score">${esc(p.score ?? 0)}</strong><span>Score</span></div>
        <div><strong>${esc(p.views ?? 0)}</strong><span>Views</span></div>
        <div><strong id="plays">${esc(p.plays || 0)}</strong><span>Plays</span></div>
      </div>
      ${/^https?:\/\//.test(link || "") ? `<a class="btn alt" href="${esc(link)}" target="_blank" rel="noopener">Open original</a>` : ""}
      ${p.editorProject ? `<a class="btn alt" href="/editor/project/${encodeURIComponent(p.id)}">${projectOwner ? "Edit Code" : "View Code"}</a>` : ""}
      <div id="owner"></div>
    </section>
    <section class="comments">
      <h2>Comments (<span id="comment-count">0</span>)</h2>
      <div id="comment-list"></div>
      <div class="form" id="comment-form"></div>
    </section>`;
  document.getElementById("replay").addEventListener("click", replay);
  document.getElementById("fullscreen").addEventListener("click", goFullscreen);
  document.getElementById("exit-full").addEventListener("click", exitFullscreen);
  if (p.platform === "cdo") setupPad();
  const fav = document.getElementById("fav");
  if (fav) {
    fav.classList.toggle("on", Array.isArray(u.favorites) && u.favorites.includes(pid));
    syncFavText();
    fav.addEventListener("click", toggleFav);
  }
  icons();
}

async function startGame() {
  const p = project;
  const game = document.getElementById("game");
  let ratio = [4, 3];
  switch (p.platform) {
    case "editor":
      game.src = location.origin + "/editor/project/" + pid + "/deployment";
      break;
    case "cdo":
      game.src = location.origin + "/turbowarp?u=" + p.link;
      ratio = /^https:\/\/studio\.code\.org\/projects\/applab/.test(p.link) ? [71, 99] : [1, 1];
      break;
    case "scratch":
      game.src = p.link + "/embed";
      ratio = [485, 402];
      break;
    case "khan": {
      const w = Math.max(window.innerWidth, 320);
      game.src = `${p.link}/embedded?embed=yes&editor=no&buttons=no&author=no&width=${w}&height=${Math.round(w * 0.75)}`;
      break;
    }
    case "wk": {
      const configPattern = /(\w+)(?:\s*=\s*["'])([^"']+)/g;
      const sanitizeBaseURI = /^(https?:\/\/|www)[^"]+/;
      const sanitizeMain = /[^\\:*?"<>|]+/;
      const sanitizeDimensions = /auto|fit-content|inherit|initial|(?:min|max)-content|revert-layer|unset|\d+.{0,2}/;
      const config = { title: "JS Game", main: "index.js", style: "position: fixed; top: 0px; left: 0px", width: "", height: "" };
      let setup = await fetch(p.link);
      setup = await setup.text();
      let configProperty;
      while ((configProperty = configPattern.exec(setup)) !== null) {
        config[configProperty[1]] = configProperty[2];
      }
      config.baseURI = Object(String(config.baseURI || "").match(sanitizeBaseURI))[0];
      config.main = Object(String(config.main).match(sanitizeMain))[0];
      config.width = Object(String(config.width).match(sanitizeDimensions))[0];
      config.height = Object(String(config.height).match(sanitizeDimensions))[0];
      game.srcdoc = `
        <html>
          <head>
            <base href="${config.baseURI ? config.baseURI : location.origin}/" target="_blank">
            <script>
              fetch("${config.main}").then(response => {
                if (response.status < 400) {
                  return response.text();
                } else {
                  throw (response.status);
                }
              }).then(data => {
                let script = document.createElement("script");
                script.textContent = data;
                document.head.appendChild(script);
              }).catch(err => {
                console.warn(err);
              })
            <\/script>
          <\/head>
          <body>
            <canvas id="game-instance"><\/canvas>
          <\/body>
        <\/html>`;
      const unit = /^\d+(\.\d+)?(px)?$/;
      ratio = unit.test(config.width || "") && unit.test(config.height || "") ? [parseFloat(config.width), parseFloat(config.height)] : [1, 1];
      break;
    }
    case "swf":
      game.srcdoc = `
        <html>
          <head>
            <script src="https://unpkg.com/@ruffle-rs/ruffle"><\/script>
          <\/head>
          <body>
            <script>
              RufflePlayer = RufflePlayer || {};
              RufflePlayer.config = { autoplay: "on", unmuteOverlay: "hidden" };
              const container = document.body;
              const ruffle = RufflePlayer.newest();
              const player = ruffle.createPlayer({});
              container.appendChild(player);
              player.style = "position: fixed; top: 0px; left: 0px; width: 100vw; height: 100vh";
              player.load("${p.link}");
            <\/script>
          <\/body>
        <\/html>`;
      break;
    default:
      game.src = p.link;
  }
  const o = p.optimalViewSize;
  if (o && o.enabled && Number(o.width) > 0 && Number(o.height) > 0) ratio = [Number(o.width), Number(o.height)];
  document.getElementById("stage").style.setProperty("--ar", ratio[0] + " / " + ratio[1]);
  game.addEventListener("load", recordPlay);
}

async function recordPlay() {
  try {
    const res = await fetch("/api/project/play/" + encodeURIComponent(pid));
    if (!res.ok) return;
    const data = await res.json();
    if (data.counted) document.getElementById("plays").textContent = data.plays;
  } catch (err) {
    console.warn("Unable to record project play:", err);
  }
}

function replay() {
  const game = document.getElementById("game");
  if (game.srcdoc) game.srcdoc = game.srcdoc;
  else game.src = game.src;
}

function goFullscreen() {
  const stage = document.getElementById("stage");
  const fallback = () => {
    stage.classList.add("full");
    updateTouchUI();
  };
  if (stage.requestFullscreen) stage.requestFullscreen().catch(fallback);
  else fallback();
}

function exitFullscreen() {
  const stage = document.getElementById("stage");
  if (document.fullscreenElement) document.exitFullscreen();
  stage.classList.remove("full");
  updateTouchUI();
}

function updateTouchUI() {
  const stage = document.getElementById("stage");
  if (!stage) return;
  const full = document.fullscreenElement === stage || stage.classList.contains("full");
  const show = full && project && project.platform === "cdo";
  stage.classList.toggle("is-fs", full);
  stage.classList.toggle("touch-ui", !!show);
  if (!show) releaseAll();
}

document.addEventListener("fullscreenchange", updateTouchUI);
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });

const keyCounts = {};
const joyHeld = new Set();
let customKey = "KeyE";
try {
  const saved = localStorage.getItem("touch-custom-key");
  if (KEYS[saved]) customKey = saved;
} catch (err) {}

function fireKey(type, def) {
  const game = document.getElementById("game");
  game.focus();
  game.contentWindow.focus();
  game.contentWindow.postMessage({
    type: "touch-key", event: type,
    key: def.key, code: def.code, keyCode: def.keyCode
  }, "*");
}
function press(name) {
  keyCounts[name] = (keyCounts[name] || 0) + 1;
  if (keyCounts[name] === 1) fireKey("keydown", KEYS[name]);
}

function release(name) {
  if (!keyCounts[name]) return;
  keyCounts[name]--;
  if (!keyCounts[name]) fireKey("keyup", KEYS[name]);
}

function releaseAll() {
  Object.keys(keyCounts).forEach(name => {
    if (keyCounts[name]) {
      keyCounts[name] = 0;
      fireKey("keyup", KEYS[name]);
    }
  });
  joyHeld.clear();
  document.querySelectorAll(".pad-btn.down").forEach(b => b.classList.remove("down"));
  const knob = document.getElementById("knob");
  if (knob) knob.style.transform = "";  
}

function syncJoy(want) {
  [...joyHeld].forEach(name => {
    if (!want.has(name)) {
      joyHeld.delete(name);
      release(name);
    }
  });
  want.forEach(name => {
    if (!joyHeld.has(name)) {
      joyHeld.add(name);
      press(name);
    }
  });
}

function bindButton(el, getName) {
  let active = null;
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    active = getName();
    press(active);
    el.classList.add("down");
  });
  const up = () => {
    if (!active) return;
    release(active);
    active = null;
    el.classList.remove("down");
  };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("lostpointercapture", up);
}

function setupPad() {
  const joy = document.getElementById("joy");
  const knob = document.getElementById("knob");
  const custom = document.getElementById("pad-custom");
  const picker = document.getElementById("keypick");
  let joyId = null;

  const moveJoy = e => {
    const rect = joy.getBoundingClientRect();
    const radius = rect.width / 2;
    let dx = e.clientX - (rect.left + radius);
    let dy = e.clientY - (rect.top + radius);
    const dist = Math.hypot(dx, dy);
    if (dist > radius) {
      dx = dx / dist * radius;
      dy = dy / dist * radius;
    }
    knob.style.transform = "translate(" + dx + "px, " + dy + "px)";
    const want = new Set();
    if (dy / radius < -0.35) want.add("KeyW");
    if (dy / radius > 0.35) want.add("KeyS");
    if (dx / radius < -0.35) want.add("KeyA");
    if (dx / radius > 0.35) want.add("KeyD");
    syncJoy(want);
  };
  const endJoy = e => {
    if (e.pointerId !== joyId) return;
    joyId = null;
    knob.style.transform = "";
    syncJoy(new Set());
  };
  joy.addEventListener("pointerdown", e => {
    e.preventDefault();
    joyId = e.pointerId;
    joy.setPointerCapture(e.pointerId);
    moveJoy(e);
  });
  joy.addEventListener("pointermove", e => { if (e.pointerId === joyId) moveJoy(e); });
  joy.addEventListener("pointerup", endJoy);
  joy.addEventListener("pointercancel", endJoy);

  bindButton(document.getElementById("pad-space"), () => "Space");
  bindButton(custom, () => customKey);

  const markSelected = () => {
    custom.textContent = KEYS[customKey].label;
    picker.querySelectorAll("button").forEach(b => b.classList.toggle("sel", b.dataset.k === customKey));
  };
  picker.innerHTML = Object.keys(KEYS).map(k => '<button type="button" data-k="' + k + '">' + KEYS[k].label + '</button>').join("");
  picker.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    customKey = b.dataset.k;
    try { localStorage.setItem("touch-custom-key", customKey); } catch (err) {}
    markSelected();
    picker.classList.remove("open");
  });
  document.getElementById("pad-gear").addEventListener("click", () => picker.classList.toggle("open"));
  markSelected();
}

function syncFavText() {
  const fav = document.getElementById("fav");
  document.getElementById("fav-text").textContent = fav.classList.contains("on") ? "Favorited" : "Favorite";
}

async function toggleFav() {
  const fav = document.getElementById("fav");
  const on = !fav.classList.contains("on");
  fav.disabled = true;
  try {
    const res = await fetch("/api/project/" + (on ? "favorite/" : "unfavorite/") + encodeURIComponent(pid));
    if (!res.ok) throw new Error("HTTP " + res.status);
    fav.classList.toggle("on", on);
    syncFavText();
    const score = document.getElementById("score");
    score.textContent = Number(score.textContent) + (on ? 1 : -1);
  } catch (err) {
    console.error(err);
  }
  fav.disabled = false;
}

async function setupOwner() {
  try {
    const res = await fetch(location.pathname + "/edit", { method: "HEAD" });
    if (!res.ok) return;
    const box = document.getElementById("owner");
    box.innerHTML = '<a class="btn alt" href="' + esc(location.pathname) + '/edit">Edit project</a><button class="btn alt danger" id="delete" type="button">Delete project</button>';
    document.getElementById("delete").addEventListener("click", deleteProject);
  } catch (err) {
    console.error(err);
  }
}

async function deleteProject() {
  if (!confirm("Warning, this is permanent! Are you sure you want to continue?")) return;
  try {
    await jsonRequest("DELETE", "/api/project/delete/" + encodeURIComponent(pid), { pid });
    location.assign("/");
  } catch (err) {
    alert(err.message);
  }
}

function isAdmin(role) {
  return role === "Admin" || role === "Uni Lover";
}

function commentScore(c) {
  if (typeof c._score === "number") return c._score;
  if (Number.isFinite(c.score)) return c.score;
  return (Array.isArray(c.upvotes) ? c.upvotes.length : 0) - (Array.isArray(c.downvotes) ? c.downvotes.length : 0);
}

function myVote(c) {
  if (typeof c._vote === "number") return c._vote;
  const u = me();
  if (!u) return 0;
  if (Array.isArray(c.upvotes) && c.upvotes.includes(u.id)) return 1;
  if (Array.isArray(c.downvotes) && c.downvotes.includes(u.id)) return -1;
  return 0;
}

function renderComments() {
  const list = Array.isArray(project.comments) ? project.comments : [];
  const u = me();
  const box = document.getElementById("comment-list");
  document.getElementById("comment-count").textContent = list.length;
  box.innerHTML = list.length ? list.map((c, i) => {
    const name = c.poster || c.username || c.author || "unknown";
    const when = timeAgo(c.createdAt || c.postedAt || c.time || c.date);
    const vote = myVote(c);
    const canDelete = u && (c.posterId === u.id || project.posterId === u.id || isAdmin(u.role));
    return `<div class="c-wrap">
    ${u ? '<div class="reply-hint"><i data-lucide="reply"></i></div>' : ""}
    <div class="comment" data-i="${i}">
      <div class="c-head">${esc(name)}${when ? " | " + esc(when) : ""}</div>
      <div class="c-body">${renderText(c.content)}</div>
      ${u ? `<div class="c-actions">
        <button class="c-btn ${vote === 1 ? "active" : ""}" data-act="up" data-i="${i}" type="button"><i data-lucide="thumbs-up"></i></button>
        <button class="c-btn ${vote === -1 ? "active" : ""}" data-act="down" data-i="${i}" type="button"><i data-lucide="thumbs-down"></i></button>
        <button class="c-btn" data-act="reply" data-i="${i}" type="button"><i data-lucide="reply"></i></button>
        ${canDelete ? `<button class="c-btn" data-act="delete" data-i="${i}" type="button"><i data-lucide="trash-2"></i></button>` : ""}
      </div>` : ""}
    </div>
  </div>`;
  }).join("") : '<div class="status">No comments yet.</div>';
  icons();
}

        //Reply to Comments
function replyTo(i) {
  const c = project.comments[i];
  const input = document.getElementById("comment-input");
  if (!c || !input) return;
  const tag = "@" + (c.poster || c.username || c.author || "unknown") + " ";
  if (!input.value.startsWith(tag)) input.value = tag + input.value;
  input.scrollIntoView({ block: "center", behavior: "smooth" });
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}

const SWIPE_TRIGGER = 64, SWIPE_MAX = 90;
let sw = null;

document.addEventListener("touchstart", e => {
  const el = e.target.closest && e.target.closest(".comment");
  if (!el || !me() || e.touches.length !== 1 || e.target.closest("a, button")) { sw = null; return; }
  const t = e.touches[0];
  sw = { el, x: t.clientX, y: t.clientY, dx: 0, lock: null };
  el.style.transition = "none";
}, { passive: true });

document.addEventListener("touchmove", e => {
  if (!sw) return;
  const t = e.touches[0];
  const dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (!sw.lock && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
    sw.lock = dx < 0 && Math.abs(dx) > Math.abs(dy) * 1.5 ? "x" : "y";
  }
  if (sw.lock !== "x") return;
  sw.dx = Math.max(dx, -SWIPE_MAX);
  sw.el.style.transform = "translateX(" + sw.dx + "px)";
  const hint = sw.el.parentNode.querySelector(".reply-hint");
  if (hint) hint.style.opacity = Math.min(1, -sw.dx / SWIPE_TRIGGER);
}, { passive: true });

function endSwipe(cancelled) {
  if (!sw) return;
  const { el, dx, lock } = sw;
  sw = null;
  el.style.transition = "";
  el.style.transform = "";
  const hint = el.parentNode.querySelector(".reply-hint");
  if (hint) hint.style.opacity = 0;
  if (!cancelled && lock === "x" && dx <= -SWIPE_TRIGGER) {
    if (navigator.vibrate) navigator.vibrate(10);
    replyTo(Number(el.dataset.i));
  }
}
document.addEventListener("touchend", () => endSwipe(false));
document.addEventListener("touchcancel", () => endSwipe(true));


function renderCommentForm() {
  const form = document.getElementById("comment-form");
  form.innerHTML = me()
    ? '<textarea id="comment-input" placeholder="Write a comment…"></textarea><button class="btn" id="comment-send" type="button">Post comment</button><div class="msg" id="comment-msg"></div>'
    : '<div class="status">Log in on the <a href="/">Profile tab</a> to comment.</div>';
  const send = document.getElementById("comment-send");
  if (send) send.addEventListener("click", sendComment);
}

let pendingVotes = 0;

document.addEventListener("click", async e => {
  const btn = e.target.closest && e.target.closest("[data-act]");
  if (!btn) return;
  const index = Number(btn.dataset.i);
const act = btn.dataset.act;
if (act === "reply") { replyTo(index); return; }
if (act === "delete") {
  btn.disabled = true;
  try {
    await jsonRequest("DELETE", "/api/project/comment/" + encodeURIComponent(pid) + "/delete", { index });
    await refreshComments();
  } catch (err) {
    console.error(err);
    btn.disabled = false;
  }
  return;
}
  const c = project.comments[index];
  if (!c) return;
  const dir = act === "up" ? 1 : -1;
  const prev = myVote(c);
  const next = prev === dir ? 0 : dir;
  c._score = commentScore(c) + (next - prev);
  c._vote = next;
  renderComments();
  sendVote(act, index);
});

async function sendVote(act, index) {
  pendingVotes++;
  try {
    const res = await fetch("/api/project/comment/" + encodeURIComponent(pid) + "/" + (act === "up" ? "upvote" : "downvote") + "?index=" + index);
    if (!res.ok) throw new Error("HTTP " + res.status);
  } catch (err) {
    console.error(err);
  }
  pendingVotes--;
  if (pendingVotes === 0) refreshComments();
}

async function refreshComments() {
  const res = await fetch("/api/project/data/" + encodeURIComponent(pid));
  if (!res.ok) return;
  project.comments = (await res.json()).comments;
  renderComments();
}

async function sendComment() {
  const input = document.getElementById("comment-input");
  const btn = document.getElementById("comment-send");
  const msg = document.getElementById("comment-msg");
  const content = input.value.trim();
  if (!content) return;
  btn.disabled = true;
  msg.textContent = "";
  try {
    await jsonRequest("POST", "/api/project/comment/" + encodeURIComponent(pid), { content });
    input.value = "";
    btn.disabled = false;
    await refreshComments();
  } catch (err) {
    msg.textContent = err.message;
    btn.disabled = false;
  }
}

document.getElementById("back").addEventListener("click", () => {
  if (history.length > 1) history.back(); else location.href = "/";
});

["gesturestart", "gesturechange", "gestureend"].forEach(type => document.addEventListener(type, e => e.preventDefault()));
let tapStart = null;
let lastTap = 0;
document.addEventListener("touchstart", e => {
  const t = e.touches[0];
  tapStart = e.touches.length === 1 ? { x: t.clientX, y: t.clientY, time: Date.now() } : null;
}, { passive: true });
document.addEventListener("touchend", e => {
  if (!tapStart) return;
  const t = e.changedTouches[0];
  const isTap = Date.now() - tapStart.time < 300 && Math.hypot(t.clientX - tapStart.x, t.clientY - tapStart.y) < 10;
  tapStart = null;
  if (!isTap) return;
  const now = Date.now();
  if (now - lastTap < 400 && !(e.target.closest && e.target.closest("#stage, input, textarea"))) e.preventDefault();
  lastTap = now;
}, { passive: false });

(function () {
  try {
    const viewed = JSON.parse(localStorage.getItem("recently-viewed-projects")) || [];
    const index = viewed.indexOf(pid);
    if (index !== -1) viewed.splice(index, 1);
    viewed.unshift(pid);
    localStorage.setItem("recently-viewed-projects", JSON.stringify(viewed));
  } catch (err) {}
})();

setInterval(() => fetch(location.href), 84e4);

icons();
load();
</script>

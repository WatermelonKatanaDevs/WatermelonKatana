<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit | WatermelonKatana</title>
    <link rel="stylesheet" type="text/css" href="/styles/style.css">
    <script src="/scripts/HtmlSanitizer.js"></script>
    <script src="/scripts/script.js"></script>
    <script src="/scripts/EmojiPicker.js"></script>
    <script src="/scripts/markdowntextbox.js"></script>
    <script src="/editor/editor/github.js"></script>
  </head>
  <body>
    <script src="/scripts/mediaupload.js"></script>
    <script src="/scripts/navbar.js"></script>
    
    <h1>Edit Project</h1>

    <form>
      <div class="error" style="background-color: red"></div>
      <br/>
      <label for="name">Name</label><br/>
      <input type="text" id="name" required/><br/>
      <div id="editorInfo" style="display:none;">
        <b>Node Editor project</b><br/>
        <span id="editorRepository"></span><br/>
        <div id="editorRevision" style="margin-top:10px; display:none;">
          <label for="editorDeploymentMode">Deployment</label><br/>
          <select id="editorDeploymentMode">
            <option value="editor">Editor</option>
            <option value="third-party">Third Party</option>
          </select>
          <div id="editorDeploymentEditorFields" style="margin-top:10px;">
            <label for="editorBranch">Branch</label><br/>
            <select id="editorBranch"></select><br/>
            <label for="editorCommit">Commit</label><br/>
            <select id="editorCommit"><option value="latest">Latest</option></select><br/>
            <label for="editorPath">Deployment Path</label><br/>
            <input id="editorPath" type="text" placeholder="/"><br/>
            <div style="opacity:.7; margin-top:6px;">Latest resolves to the newest commit on the selected branch each time the project is loaded.</div>
          </div>
          <div id="editorDeploymentThirdPartyFields" style="display:none; margin-top:10px;">
            <label for="editorExternalUrl">External URL</label><br/>
            <input id="editorExternalUrl" type="url" placeholder="https://example.com/">
          </div>
        </div>
      </div>
      <div id="linkField">
        <label for="link">Link</label><br/>
        <input type="text" id="link" required/><br/>
      </div>
      <label for="desc">Description</label><br/>
      <textarea id="desc"></textarea><br/>
      <div class="mk-description-preview-wrap">
        <div class="mk-description-preview-title">Preview</div>
        <div id="descPreview" class="mk-description-preview" aria-live="polite"></div>
      </div>
      <label for="thumb">Thumbnail</label><br/>
      <button type="button" class="uploadbutton" onclick="uploadThumb()">
        Edit Thumbnail<br>
        <img id="thumb" style="max-width:100px; max-height:100px;">
      </button><br>
      <div id="storageContainer" style="display: none;">
        <label for="storage"> Project Data </label><br>
        <textarea id="storage"></textarea><br>
      </div>
      <label for="tags">Tags</label><br>
      <input type="text" id="tags"><br>
      <label for="mature">Mature
        <input type="checkbox" id="mature">
        <span class="checkbox"></span>
      </label><br>
      <label for="hidden">Hidden
        <input type="checkbox" id="hidden">
        <span class="checkbox"></span>
      </label><br>
      <div id="optimalViewSize" style="margin-top:16px; padding:16px; border:1px solid var(--palette-background-item); border-radius:8px;">
        <label style="display:block; margin-bottom:10px;">Optimal View Size</label>
        <label for="optimal-view-use">
          <input type="checkbox" id="optimal-view-use">
          Use custom view size
        </label>
        <div id="optimal-view-options" style="display:none; margin-top:12px;">
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <label for="optimal-view-width">Width<br/>
              <input id="optimal-view-width" type="number" min="1" max="10000" step="1">
            </label>
            <label for="optimal-view-height">Height<br/>
              <input id="optimal-view-height" type="number" min="1" max="10000" step="1">
            </label>
          </div>
          <label for="optimal-view-mode" style="display:block; margin-top:10px;">Scaling<br/>
            <select id="optimal-view-mode">
              <option value="ratio">Scale to fit ratio</option>
              <option value="fixed">Fixed pixel size</option>
            </select>
          </label>
        </div>
      </div>
      <input type="submit" value="update"/><br/>
      <div id="adminControls" style="display:none; margin-top:20px; padding:16px; border:1px solid var(--palette-background-item); border-radius:8px;">
        <h3 style="margin-top:0;">Project Admin</h3>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button type="button" id="featureProjectBtn"></button>
          <button type="button" id="verifyProjectBtn"></button>
        </div>
        <div id="adminStatus" style="margin-top:10px;"></div>
      </div>
    </form>
    <!-- <button id="deletebtn" style="background-color: red;">delete</button> -->
    <button id="discardbtn"> Discard Changes </button>
    <script>
      const form = document.querySelector("form");
      const name = document.querySelector("#name");
      const link = document.querySelector("#link");
      const linkField = document.querySelector("#linkField");
      const editorInfo = document.querySelector("#editorInfo");
      const editorRepositoryEl = document.querySelector("#editorRepository");
      let editorProject = false;
      let editorRepository = "";
      let editorDeployment = null;
      const editorRevision = document.querySelector("#editorRevision");
      const editorBranch = document.querySelector("#editorBranch");
      const editorCommit = document.querySelector("#editorCommit");
      const editorDeploymentMode = document.querySelector("#editorDeploymentMode");
      const editorDeploymentEditorFields = document.querySelector("#editorDeploymentEditorFields");
      const editorDeploymentThirdPartyFields = document.querySelector("#editorDeploymentThirdPartyFields");
      const editorPath = document.querySelector("#editorPath");
      const editorExternalUrl = document.querySelector("#editorExternalUrl");
      const desc = document.querySelector("#desc");
      const descPreview = document.querySelector("#descPreview");
      const thumb = document.querySelector("#thumb");

      function renderDescriptionPreview() {
        descPreview.innerHTML = convertMarkdown(desc.value || "");
      }
      const storage = document.querySelector('#storage');
      const tags = document.querySelector("#tags");
      const mature = document.querySelector('#mature');
      const hidden = document.querySelector('#hidden');
      const optimalUse = document.querySelector('#optimal-view-use');
      const optimalOptions = document.querySelector('#optimal-view-options');
      const optimalWidth = document.querySelector('#optimal-view-width');
      const optimalHeight = document.querySelector('#optimal-view-height');
      const optimalMode = document.querySelector('#optimal-view-mode');

      function updateOptimalViewVisibility() {
        optimalOptions.style.display = optimalUse.checked ? '' : 'none';
      }
      optimalUse.addEventListener('change', updateOptimalViewVisibility);
      const display = document.querySelector(".error");
      const adminControls = document.querySelector("#adminControls");
      const featureProjectBtn = document.querySelector("#featureProjectBtn");
      const verifyProjectBtn = document.querySelector("#verifyProjectBtn");
      const adminStatus = document.querySelector("#adminStatus");
      let projectFeatured = false;
      let projectVerified = false;

      async function githubConfig() {
        await fetch('/editor/workers.json', {cache:'no-store'}).then(async response => {
          if (!response.ok) throw new Error(`Failed to load GitHub authentication configuration (${response.status}).`);
          window.WorkerConfig = await response.json();
        });
        await window.GitHubService?.init?.();
        if (!window.GitHubService) throw new Error('GitHub support is unavailable.');
        return window.GitHubService;
      }

      function parseRepository(url) {
        try {
          const parsed = new URL(String(url || '').trim());
          if (!/^https?:$/i.test(parsed.protocol) || !/^(www\.)?github\.com$/i.test(parsed.hostname)) return null;
          const parts = parsed.pathname.split('/').filter(Boolean);
          if (parts.length !== 2) return null;
          return {owner:parts[0], repo:parts[1]};
        } catch (_) {
          return null;
        }
      }

      async function loadEditorRevisionOptions(initial = null) {
        const repository = parseRepository(editorRepository);
        if (!repository) {
          editorRevision.style.display = 'none';
          return;
        }
        editorRevision.style.display = '';
        const github = await githubConfig();
        let branches = [];
        try {
          branches = await github.listBranches(repository.owner, repository.repo);
        } catch (_) {}
        const savedBranch = String(initial?.branch || '').trim();
        const branch = savedBranch || branches[0] || 'main';
        if (!branches.includes(branch)) branches.unshift(branch);
        editorBranch.innerHTML = branches.map(value => `<option value="${escapeHTML(value)}">${escapeHTML(value)}</option>`).join('');
        editorBranch.value = branch;
        await loadEditorCommits(initial?.commit || 'latest');
      }

      async function loadEditorCommits(savedCommit = 'latest') {
        const repository = parseRepository(editorRepository);
        if (!repository || !editorBranch.value) return;
        const github = await githubConfig();
        let commits = [];
        try {
          commits = await github.listCommits(repository.owner, repository.repo, editorBranch.value, 30);
        } catch (_) {}
        const desired = String(savedCommit || 'latest').trim() || 'latest';
        const options = [
          '<option value="latest">Latest</option>',
          ...commits.map(commit => `<option value="${escapeHTML(commit.sha)}">${escapeHTML(commit.message || commit.sha.slice(0, 12))}</option>`)
        ];
        if (desired !== 'latest' && !commits.some(commit => commit.sha === desired)) {
          options.splice(1, 0, `<option value="${escapeHTML(desired)}">Pinned ${escapeHTML(desired.slice(0, 12))}</option>`);
        }
        editorCommit.innerHTML = options.join('');
        editorCommit.value = desired;
        if (editorCommit.value !== desired) editorCommit.value = 'latest';
      }

      editorBranch.addEventListener('change', () => loadEditorCommits('latest').catch(err => {
        display.textContent = err?.message || String(err);
      }));
      function syncEditorDeploymentMode(mode) {
        const thirdParty = mode === 'third-party';
        editorDeploymentEditorFields.style.display = thirdParty ? 'none' : '';
        editorDeploymentThirdPartyFields.style.display = thirdParty ? '' : 'none';
      }
      editorDeploymentMode.addEventListener('change', () => syncEditorDeploymentMode(editorDeploymentMode.value));

      function updateAdminButtons() {
        featureProjectBtn.textContent = projectFeatured ? "Unfeature Project" : "Feature Project";
        verifyProjectBtn.textContent = projectVerified ? "Remove Blue-check" : "Enable Blue-check";
      }

      async function updateProjectFlag(type, enabled) {
        const endpoint = type === "featured"
          ? (enabled ? "/api/project/feature/" : "/api/project/unfeature/")
          : (enabled ? "/api/project/verify/" : "/api/project/unverify/");
        const button = type === "featured" ? featureProjectBtn : verifyProjectBtn;
        button.disabled = true;
        adminStatus.textContent = "Updating…";
        try {
          const response = await fetch(endpoint + pid);
          if (!response.ok) throw new Error("Unable to update project " + type + ".");
          if (type === "featured") projectFeatured = enabled;
          else projectVerified = enabled;
          updateAdminButtons();
          adminStatus.textContent = "Updated.";
        } catch (err) {
          adminStatus.textContent = err.message;
        } finally {
          button.disabled = false;
        }
      }

      featureProjectBtn.onclick = () => updateProjectFlag("featured", !projectFeatured);
      verifyProjectBtn.onclick = () => updateProjectFlag("verified", !projectVerified);

      location.path = location.pathname.split("/");
      const pid = location.path[2];

      const discardbtn = document.querySelector("#discardbtn");
      discardbtn.onclick = () => {
        if(confirm("Are you sure you want to discard your changes?")) {
          location.assign("/project/"+pid);
        }
      }
      // const deletebtn = document.querySelector("#deletebtn");
      // deletebtn.onclick = async () => {
      //   if (!confirm("Warning, this is permanent! Are you sure you want to continue?")) return;
      //   await fetch("/api/project/delete/" + pid, {
      //     method: "DELETE",
      //     body: JSON.stringify({ pid }),
      //     headers: { "Content-Type": "application/json" },
      //   });
      //   location.assign("/");
      // };

      (async () => {
        const res = await fetch("/api/project/data/" + pid);
        const data = await res.json();
        name.value = data.title;
        link.value = data.link;
        editorProject = !!data.editorProject;
        editorRepository = data.editorRepository || "";
        editorDeployment = data.editorDeployment || null;
        if (editorProject) {
          linkField.style.display = "none";
          link.required = false;
          editorInfo.style.display = "";
          editorRepositoryEl.textContent = editorRepository || data.link || "";
          await loadEditorRevisionOptions(editorDeployment || {branch:'main', commit:'latest'});
          editorDeploymentMode.value = editorDeployment?.mode === 'third-party' ? 'third-party' : 'editor';
          editorPath.value = editorDeployment?.path || editorDeployment?.url || '/';
          editorExternalUrl.value = editorDeployment?.externalUrl || '';
          syncEditorDeploymentMode(editorDeploymentMode.value);
        }
        desc.value = data.content;
        thumb.src = data.thumbnail || "";
        thumb.value = data.thumbnail || "";
        // data only gets fetched once it will not try to grab other projects data if updated
        if(!editorProject && isCDOStorage(link.value)) {
          storage.textContent = "fetching data.... please wait"
          document.getElementById("storageContainer").style.display = "";
          getCDOStorage(link.value).then(json => {
            storage.textContent = json;
          });
          link.onchange = null;
        }
        tags.value = data.tags.join(", ");
        mature.checked = data.mature;
        hidden.checked = data.hidden;
        const optimal = data.optimalViewSize || {};
        optimalUse.checked = !!optimal.enabled;
        optimalWidth.value = Number(optimal.width) > 0 ? Number(optimal.width) : 1;
        optimalHeight.value = Number(optimal.height) > 0 ? Number(optimal.height) : 1;
        optimalMode.value = optimal.mode === 'fixed' ? 'fixed' : 'ratio';
        updateOptimalViewVisibility();
        projectFeatured = !!data.featured;
        projectVerified = !!data.verified;
        updateAdminButtons();
        const auth = await getAuth();
        if (auth.auth && auth.user && ["Admin", "Uni Lover"].includes(auth.user.role)) {
          adminControls.style.display = "";
        }
        markdownTextbox('#desc');
        renderDescriptionPreview();
        desc.addEventListener('input', renderDescriptionPreview);
        var tok = await getAuth();
        if (tok.user?.mature) return;
        // mature.outerHTML = data.mature.toString(); // dragon somehow you broke it twice lmfao
      })();
      
      async function uploadThumb() {
        var url = await getFileUpload(thumb.value);
        if (!url) return;
        thumb.src = url;
        thumb.value = url;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        display.textContent = "";
        if (!editorProject && !link.value.match(/^https?:\/\/[^"]+$/)) 
          return (display.textContent = "Link is not a vaild URL");
        if (thumb.value && !thumb.value.match(/^https?:\/\/[^"]+$/) && !thumb.value.match(/^\/api\/media\/[^"]+$/)) 
          return display.textContent = 'Thumbnail is not a vaild URL';
        var taglist = tags.value.toLowerCase().replace(/[^,\w\d_-]/g,"").split(",");
        if (taglist.length < 3)
          return display.textContent = 'Choose at least 3 tags';    
        if (taglist.length > 10)
          return display.textContent = 'You can only choose a maximum of 10 tags';
        try {
          const res = await fetch("/api/project/update/" + pid, {
            method: "PUT",
            body: JSON.stringify({
              title: name.value,
              link: editorProject ? editorRepository : link.value,
              content: desc.value,
              thumbnail: thumb.value,
              tags: taglist,
              mature: mature.checked,
              hidden: hidden.checked,
              privateRecipients: [],
              editorProject,
              editorRepository,
              editorDeployment: editorProject ? {
                mode: editorDeploymentMode.value === 'third-party' ? 'third-party' : 'editor',
                branch: editorDeploymentMode.value === 'editor' ? editorBranch.value : '',
                commit: editorDeploymentMode.value === 'editor' ? (editorCommit.value || 'latest') : '',
                path: editorDeploymentMode.value === 'editor' ? (editorPath.value || '/') : '',
                usePeerServer: editorDeploymentMode.value === 'editor' ? (editorDeployment?.usePeerServer === true) : false,
                peerLayer: editorDeployment?.peerLayer || 'peer',
                externalUrl: editorDeploymentMode.value === 'third-party' ? editorExternalUrl.value.trim() : '',
                externalMode: 'iframe',
                saveEnvironmentVariables: editorDeploymentMode.value === 'editor' ? (editorDeployment?.saveEnvironmentVariables === true) : false
              } : null,
              optimalViewSize: {
                enabled: optimalUse.checked,
                width: Math.max(1, Number(optimalWidth.value) || 1),
                height: Math.max(1, Number(optimalHeight.value) || 1),
                mode: optimalMode.value === 'fixed' ? 'fixed' : 'ratio'
              }
            }),
            headers: { "Content-Type": "application/json" },
          });
          const data = await res.json();
          if (res.status === 400 || res.status === 401) {
            return (display.textContent =
              data.message + ". " + (data.error ? data.error : ""));
          }
          if (!editorProject) await populateCDOStorage(link.value, storage.value, true);
          location.assign("/project/" + data.id);
        } catch (err) {
          console.error(err.message);
          alert(err.message);
        }
      });
    </script>
  </body>
</html>

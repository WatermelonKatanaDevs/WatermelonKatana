<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit Profile | WatermelonKatana</title>
    <link rel="stylesheet" type="text/css" href="/styles/style.css">
    <link rel="stylesheet" type="text/css" href="/styles/user.css">
    <script src="/scripts/HtmlSanitizer.js"></script>
    <script src="/scripts/script.js"></script>
    <script src="/scripts/EmojiPicker.js"></script>
    <script src="/scripts/markdowntextbox.js"></script>
    <style>
      .editor-field { margin: 12px 0; }
      .positioner {
        border-radius: 10px;
        cursor: grab;
        touch-action: none;
        background-color: var(--palette-background-item);
        overflow: hidden;
      }
      .positioner:active { cursor: grabbing; }
      .positioner.avatar-frame { width: 140px; height: 140px; border-radius: 50%; }
      .positioner.banner-frame { width: 100%; max-width: 480px; height: 160px; }
      .zoomrow { display: flex; align-items: center; gap: 10px; max-width: 480px; margin-top: 8px; }
      .zoomrow input[type="range"] { flex: 1; }
      #flair-section {
        margin: 16px 0;
        padding: 14px;
        border-radius: 10px;
        background: var(--palette-background-item);
      }
      #flair-section label { margin-right: 8px; }
      #flair-section select, #flair-section input[type="color"] {
        padding: 4px; border-radius: 5px; margin-right: 12px;
      }
      .flair-part {
        margin: 12px 0; padding: 12px; border-radius: 8px;
        border: 1px solid var(--palette-background-container);
      }
      .flair-part legend { padding: 0 6px; font-weight: bold; }
      .flair-part .editrow { margin: 8px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .fp-colors span { margin-right: 10px; }
      .hint { font-size: 13px; color: #999; }
    </style>
  </head>
  <body>
    <script src="/scripts/mediaupload.js"></script>
    <script src="/scripts/navbar.js"></script>

    <h1>Edit Profile</h1>

    <form>
      <div class="error" style="background-color: red"></div>
      <br>
      <label for="name">Username</label><br>
      <input type="text" id="name" required/><br>

      <label for="bio">Biography</label><br>
      <textarea id="bio"></textarea><br>

      <div class="editor-field">
        <label>Avatar</label><br>
        <button type="button" class="uploadbutton" onclick="uploadavatar()">Change Avatar Image</button>
        <div class="hint">Drag to reposition, slider to zoom.</div>
        <div id="avatar-frame" class="positioner avatar-frame"></div>
        <div class="zoomrow">
          <span>Zoom</span>
          <input type="range" id="avatar-zoom" min="100" max="400" step="1">
        </div>
      </div>

      <div class="editor-field">
        <label>Banner</label><br>
        <button type="button" class="uploadbutton" onclick="uploadbanner()">Change Banner Image</button>
        <div class="hint">Drag to reposition, slider to zoom.</div>
        <div id="banner-frame" class="positioner banner-frame"></div>
        <div class="zoomrow">
          <span>Zoom</span>
          <input type="range" id="banner-zoom" min="100" max="400" step="1">
        </div>
      </div>

      <div id="flair-section" style="display:none">
        <h3>Uni Lover Flair</h3>
      </div>

      <label for="mature">Mature
        <input type="checkbox" id="mature">
        <span class="checkbox"></span>
      </label><br>
      <input type="submit" value="update"/><br>
    </form>
    <br/>
    <div style="position: relative; top: 60px; transform: translateX(-45%)">
      <button id="discardbtn"> Discard Changes </button>
      <br><br>
      <button id="deletebtn"> Delete Account</button>
    </div>

    <script>
      const form = document.querySelector("form");
      const name = document.querySelector("#name");
      const bio = document.querySelector("#bio");
      const mature = document.querySelector("#mature");
      const display = document.querySelector(".error");

      const avatarframe = document.querySelector("#avatar-frame");
      const bannerframe = document.querySelector("#banner-frame");
      const avatarzoom = document.querySelector("#avatar-zoom");
      const bannerzoom = document.querySelector("#banner-zoom");

      const flairsection = document.querySelector("#flair-section");
      const flairparts = [
        { key: "name", label: "Username", border: false },
        { key: "avatar", label: "Avatar border", border: true },
        { key: "banner", label: "Banner border", border: true },
      ];
      const flairstate = {};

      let avatarurl = "";
      let bannerurl = "";
      let avatarpos = { x: 50, y: 50, zoom: 100 };
      let bannerpos = { x: 50, y: 50, zoom: 100 };

      function makepositioner(frame, slider, geturl, getpos) {
        frame.style.overflow = "hidden";
        const img = document.createElement("img");
        img.style.width = "100%";
        img.style.height = "100%";
        img.style.objectFit = "cover";
        img.style.display = "block";
        img.style.pointerEvents = "none";
        frame.appendChild(img);
        let dragging = false, startx = 0, starty = 0, basex = 50, basey = 50;
        const refresh = () => {
          const pos = getpos();
          const x = clampnum(pos.x, 0, 100, 50);
          const y = clampnum(pos.y, 0, 100, 50);
          const zoom = clampnum(pos.zoom, 100, 400, 100);
          img.src = safeurl(geturl());
          img.style.objectPosition = x + "% " + y + "%";
          img.style.transform = "scale(" + (zoom / 100) + ")";
          img.style.transformOrigin = x + "% " + y + "%";
        };
        frame.addEventListener("pointerdown", (e) => {
          dragging = true;
          startx = e.clientX; starty = e.clientY;
          basex = getpos().x; basey = getpos().y;
          frame.setPointerCapture(e.pointerId);
        });
        frame.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const rect = frame.getBoundingClientRect();
          const pos = getpos();
          pos.x = clampnum(basex - (e.clientX - startx) / rect.width * 100, 0, 100, 50);
          pos.y = clampnum(basey - (e.clientY - starty) / rect.height * 100, 0, 100, 50);
          refresh();
        });
        frame.addEventListener("pointerup", () => { dragging = false; });
        frame.addEventListener("pointercancel", () => { dragging = false; });
        slider.addEventListener("input", () => {
          getpos().zoom = clampnum(slider.value, 100, 400, 100);
          refresh();
        });
        return refresh;
      }

      const refreshavatar = makepositioner(avatarframe, avatarzoom, () => avatarurl, () => avatarpos);
      const refreshbanner = makepositioner(bannerframe, bannerzoom, () => bannerurl, () => bannerpos);

      function makeflairpart(def, src) {
        src = src || {};
        const palette = ["#ff5f6d", "#4facfe", "#b06ab3"];
        const state = {
          enabled: !!src.enabled,
          style: ["rainbow", "custom"].includes(src.style) ? src.style : "rainbow",
          colors: Array.isArray(src.colors) ? src.colors.filter(hexok) : [],
          angle: clampnum(src.angle, 0, 360, 90),
          speed: clampnum(src.speed, 1, 30, 6),
          thickness: clampnum(src.thickness, 1, 12, 4),
          glow: !!src.glow,
        };
        const wrap = document.createElement("fieldset");
        wrap.className = "flair-part";
        wrap.innerHTML = `
          <legend>${def.label}</legend>
          <div class="editrow">
            <label><input type="checkbox" class="fp-enabled"><span class="checkbox"></span> Enabled</label>
            <label>Style
              <select class="fp-style">
                <option value="rainbow">Rainbow</option>
                <option value="custom">Custom colours</option>
              </select>
            </label>
          </div>
          <div class="editrow fp-colors"></div>
          <div class="editrow">
            <label>Angle <input type="range" class="fp-angle" min="0" max="360" step="1"></label>
            <label>Speed <input type="range" class="fp-speed" min="1" max="30" step="1"></label>
          </div>
          ${def.border ? `<div class="editrow">
            <label>Thickness <input type="range" class="fp-thickness" min="1" max="12" step="1"></label>
            <label><input type="checkbox" class="fp-glow"><span class="checkbox"></span> Glow</label>
          </div>` : ""}
        `;
        const enabled = wrap.querySelector(".fp-enabled");
        const style = wrap.querySelector(".fp-style");
        const colorsbox = wrap.querySelector(".fp-colors");
        const angle = wrap.querySelector(".fp-angle");
        const speed = wrap.querySelector(".fp-speed");
        const thickness = def.border ? wrap.querySelector(".fp-thickness") : null;
        const glow = def.border ? wrap.querySelector(".fp-glow") : null;

        enabled.checked = state.enabled;
        style.value = state.style;
        angle.value = state.angle;
        speed.value = state.speed;
        if (thickness) thickness.value = state.thickness;
        if (glow) glow.checked = state.glow;

        const slots = [];
        for (let i = 0; i < 3; i++) {
          const row = document.createElement("span");
          const label = document.createElement("label");
          const use = document.createElement("input");
          use.type = "checkbox";
          use.checked = i < state.colors.length;
          const box = document.createElement("span");
          box.className = "checkbox";
          label.appendChild(use);
          label.appendChild(box);
          const color = document.createElement("input");
          color.type = "color";
          color.value = state.colors[i] || palette[i];
          row.appendChild(label);
          row.appendChild(color);
          colorsbox.appendChild(row);
          slots.push({ use, color });
        }

        function readcolors() {
          state.colors = slots.filter(s => s.use.checked).map(s => s.color.value);
        }
        function synccolors() {
          colorsbox.style.display = style.value === "custom" ? "flex" : "none";
        }

        enabled.addEventListener("change", () => state.enabled = enabled.checked);
        style.addEventListener("change", () => { state.style = style.value; synccolors(); });
        angle.addEventListener("input", () => state.angle = clampnum(angle.value, 0, 360, 90));
        speed.addEventListener("input", () => state.speed = clampnum(speed.value, 1, 30, 6));
        if (thickness) thickness.addEventListener("input", () => state.thickness = clampnum(thickness.value, 1, 12, 4));
        if (glow) glow.addEventListener("change", () => state.glow = glow.checked);
        slots.forEach(s => {
          s.use.addEventListener("change", readcolors);
          s.color.addEventListener("input", readcolors);
        });

        readcolors();
        synccolors();
        return { state, wrap };
      }

      function buildflairui(userflair) {
        userflair = userflair || {};
        for (const def of flairparts) {
          const part = makeflairpart(def, userflair[def.key]);
          flairstate[def.key] = part.state;
          flairsection.appendChild(part.wrap);
        }
      }

      const discardbtn = document.querySelector("#discardbtn");
      discardbtn.onclick = () => {
        if (confirm("Are you sure you want to discard your changes?")) {
          location.assign(`/user/${name.value}`);
        }
      };

      const deletebtn = document.querySelector("#deletebtn");
      deletebtn.onclick = async () => {
        var confirmationPswd = prompt("Warning, this is permanent! Enter your password to continue.");
        if (!confirmationPswd) return;
        await fetch("/api/auth/deleteSelf", {
          method: "DELETE",
          body: JSON.stringify({ confirmationPswd }),
          headers: { "Content-Type": "application/json" },
        });
        location.assign("/");
      };

      (async () => {
        const data = await getAuth();
        if (!data.auth) alert("Not signed in!");
        const user = data.user;
        name.value = user.username;
        bio.value = user.biography || "";
        avatarurl = user.avatar || "";
        bannerurl = user.banner || "";
        avatarpos = { x: 50, y: 50, zoom: 100, ...(user.avatarpos || {}) };
        bannerpos = { x: 50, y: 50, zoom: 100, ...(user.bannerpos || {}) };
        avatarzoom.value = avatarpos.zoom;
        bannerzoom.value = bannerpos.zoom;
        mature.checked = user.mature;
        refreshavatar();
        refreshbanner();

        if (isadmin(user.role)) {
          flairsection.style.display = "block";
          buildflairui(user.flair || {});
        }

        markdownTextbox('#bio');
      })();

      async function uploadavatar() {
        var url = await getFileUpload(avatarurl);
        if (!url) return;
        avatarurl = url;
        avatarpos = { x: 50, y: 50, zoom: 100 };
        avatarzoom.value = 100;
        refreshavatar();
      }

      async function uploadbanner() {
        var url = await getFileUpload(bannerurl);
        if (!url) return;
        bannerurl = url;
        bannerpos = { x: 50, y: 50, zoom: 100 };
        bannerzoom.value = 100;
        refreshbanner();
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        display.textContent = "";
        if (avatarurl && !avatarurl.match(/^https?:\/\/[^"]+$/) && !avatarurl.match(/^\/api\/media\/[^"]+$/))
          return display.textContent = 'Avatar is not a vaild URL';
        if (bannerurl && !bannerurl.match(/^https?:\/\/[^"]+$/) && !bannerurl.match(/^\/api\/media\/[^"]+$/))
          return display.textContent = 'Banner is not a vaild URL';
        try {
          const res = await fetch("/api/auth/update", {
            method: "PUT",
            body: JSON.stringify({
              username: name.value,
              biography: bio.value,
              avatar: avatarurl,
              banner: bannerurl,
              mature: mature.checked,
              avatarpos,
              bannerpos,
              flair: flairstate,
            }),
            headers: { "Content-Type": "application/json" },
          });
          const result = await res.json();
          if (res.status === 400 || res.status === 401) {
            return (display.textContent =
              result.message + ". " + (result.error ? result.error : ""));
          }
          location.assign(`/user/${name.value}`);
        } catch (err) {
          console.error(err.message);
          alert(err.message);
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit Profile | WatermelonKatana</title>
    <link rel="stylesheet" type="text/css" href="/styles/style.css">
    <link rel="stylesheet" type="text/css" href="/styles/user.css">
    <script src="/scripts/HtmlSanitizer.js"></script>
    <script src="/scripts/script.js"></script>
    <script src="/scripts/EmojiPicker.js"></script>
    <script src="/scripts/markdowntextbox.js"></script>
    <style>
      .editor-field { margin: 12px 0; }
      .positioner {
        border-radius: 10px;
        cursor: grab;
        touch-action: none;
        background-color: var(--palette-background-item);
        overflow: hidden;
      }
      .positioner:active { cursor: grabbing; }
      .positioner.avatar-frame { width: 140px; height: 140px; border-radius: 50%; }
      .positioner.banner-frame { width: 100%; max-width: 480px; height: 160px; }
      .zoomrow { display: flex; align-items: center; gap: 10px; max-width: 480px; margin-top: 8px; }
      .zoomrow input[type="range"] { flex: 1; }
      #flair-section {
        margin: 16px 0;
        padding: 14px;
        border-radius: 10px;
        background: var(--palette-background-item);
      }
      #flair-section label { margin-right: 8px; }
      #flair-section select, #flair-section input[type="color"] {
        padding: 4px; border-radius: 5px; margin-right: 12px;
      }
      .hint { font-size: 13px; color: #999; }
    </style>
  </head>
  <body>
    <script src="/scripts/mediaupload.js"></script>
    <script src="/scripts/navbar.js"></script>

    <h1>Edit Profile</h1>

    <form>
      <div class="error" style="background-color: red"></div>
      <br>
      <label for="name">Username</label><br>
      <input type="text" id="name" required/><br>

      <label for="bio">Biography</label><br>
      <textarea id="bio"></textarea><br>

      <div class="editor-field">
        <label>Avatar</label><br>
        <button type="button" class="uploadbutton" onclick="uploadavatar()">Change Avatar Image</button>
        <div class="hint">Drag to reposition, slider to zoom.</div>
        <div id="avatar-frame" class="positioner avatar-frame"></div>
        <div class="zoomrow">
          <span>Zoom</span>
          <input type="range" id="avatar-zoom" min="100" max="400" step="1">
        </div>
      </div>

      <div class="editor-field">
        <label>Banner</label><br>
        <button type="button" class="uploadbutton" onclick="uploadbanner()">Change Banner Image</button>
        <div class="hint">Drag to reposition, slider to zoom.</div>
        <div id="banner-frame" class="positioner banner-frame"></div>
        <div class="zoomrow">
          <span>Zoom</span>
          <input type="range" id="banner-zoom" min="100" max="400" step="1">
        </div>
      </div>

      <div id="flair-section" style="display:none">
        <h3>Uni Lover Flair</h3>
        <div class="hint">Add an animated border to your avatar or banner.</div>
        <div class="editor-field">
          <label for="flair-target">Apply to</label>
          <select id="flair-target">
            <option value="none">None</option>
            <option value="avatar">Avatar border</option>
            <option value="banner">Banner border</option>
          </select>
          <label for="flair-style">Style</label>
          <select id="flair-style">
            <option value="rainbow">Rainbow</option>
            <option value="custom">Custom colours</option>
          </select>
          <span id="flair-colors" style="display:none">
            <input type="color" id="flair-color1" value="#ff5f6d">
            <input type="color" id="flair-color2" value="#4facfe">
          </span>
        </div>
      </div>

      <label for="mature">Mature
        <input type="checkbox" id="mature">
        <span class="checkbox"></span>
      </label><br>
      <input type="submit" value="update"/><br>
    </form>
    <br/>
    <div style="position: relative; top: 60px; transform: translateX(-45%)">
      <button id="discardbtn"> Discard Changes </button>
      <br><br>
      <button id="deletebtn"> Delete Account</button>
    </div>

    <script>
      const form = document.querySelector("form");
      const name = document.querySelector("#name");
      const bio = document.querySelector("#bio");
      const mature = document.querySelector("#mature");
      const display = document.querySelector(".error");

      const avatarframe = document.querySelector("#avatar-frame");
      const bannerframe = document.querySelector("#banner-frame");
      const avatarzoom = document.querySelector("#avatar-zoom");
      const bannerzoom = document.querySelector("#banner-zoom");

      const flairsection = document.querySelector("#flair-section");
      const flairtarget = document.querySelector("#flair-target");
      const flairstyle = document.querySelector("#flair-style");
      const flaircolors = document.querySelector("#flair-colors");
      const flaircolor1 = document.querySelector("#flair-color1");
      const flaircolor2 = document.querySelector("#flair-color2");

      let avatarurl = "";
      let bannerurl = "";
      let avatarpos = { x: 50, y: 50, zoom: 100 };
      let bannerpos = { x: 50, y: 50, zoom: 100 };

      function paint(frame, url, pos) {
        frame.style.cssText = frame.getAttribute("data-base") + focalstyle(url, pos);
      }

      function makepositioner(frame, slider, geturl, getpos) {
        frame.setAttribute("data-base", frame.style.cssText);
        let dragging = false, startx = 0, starty = 0, basex = 50, basey = 50;
        const refresh = () => paint(frame, geturl(), getpos());
        frame.addEventListener("pointerdown", (e) => {
          dragging = true;
          startx = e.clientX; starty = e.clientY;
          basex = getpos().x; basey = getpos().y;
          frame.setPointerCapture(e.pointerId);
        });
        frame.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const rect = frame.getBoundingClientRect();
          const pos = getpos();
          pos.x = clampnum(basex - (e.clientX - startx) / rect.width * 100, 0, 100, 50);
          pos.y = clampnum(basey - (e.clientY - starty) / rect.height * 100, 0, 100, 50);
          refresh();
        });
        frame.addEventListener("pointerup", () => { dragging = false; });
        slider.addEventListener("input", () => {
          getpos().zoom = clampnum(slider.value, 100, 400, 100);
          refresh();
        });
        return refresh;
      }

      const refreshavatar = makepositioner(avatarframe, avatarzoom, () => avatarurl, () => avatarpos);
      const refreshbanner = makepositioner(bannerframe, bannerzoom, () => bannerurl, () => bannerpos);

      function syncflaircolors() {
        flaircolors.style.display = flairstyle.value === "custom" ? "inline" : "none";
      }
      flairstyle.addEventListener("change", syncflaircolors);

      const discardbtn = document.querySelector("#discardbtn");
      discardbtn.onclick = () => {
        if (confirm("Are you sure you want to discard your changes?")) {
          location.assign(`/user/${name.value}`);
        }
      };

      const deletebtn = document.querySelector("#deletebtn");
      deletebtn.onclick = async () => {
        var confirmationPswd = prompt("Warning, this is permanent! Enter your password to continue.");
        if (!confirmationPswd) return;
        await fetch("/api/auth/deleteSelf", {
          method: "DELETE",
          body: JSON.stringify({ confirmationPswd }),
          headers: { "Content-Type": "application/json" },
        });
        location.assign("/");
      };

      (async () => {
        const data = await getAuth();
        if (!data.auth) alert("Not signed in!");
        const user = data.user;
        name.value = user.username;
        bio.value = user.biography || "";
        avatarurl = user.avatar || "";
        bannerurl = user.banner || "";
        avatarpos = { x: 50, y: 50, zoom: 100, ...(user.avatarpos || {}) };
        bannerpos = { x: 50, y: 50, zoom: 100, ...(user.bannerpos || {}) };
        avatarzoom.value = avatarpos.zoom;
        bannerzoom.value = bannerpos.zoom;
        mature.checked = user.mature;
        refreshavatar();
        refreshbanner();

        if (isadmin(user.role)) {
          flairsection.style.display = "block";
          const flair = user.flair || {};
          flairtarget.value = ["none", "avatar", "banner"].includes(flair.target) ? flair.target : "none";
          flairstyle.value = ["rainbow", "custom"].includes(flair.style) ? flair.style : "rainbow";
          if (/^#[0-9a-fA-F]{6}$/.test(flair.color1)) flaircolor1.value = flair.color1;
          if (/^#[0-9a-fA-F]{6}$/.test(flair.color2)) flaircolor2.value = flair.color2;
          syncflaircolors();
        }

        markdownTextbox('#bio');
      })();

      async function uploadavatar() {
        var url = await getFileUpload(avatarurl);
        if (!url) return;
        avatarurl = url;
        avatarpos = { x: 50, y: 50, zoom: 100 };
        avatarzoom.value = 100;
        refreshavatar();
      }

      async function uploadbanner() {
        var url = await getFileUpload(bannerurl);
        if (!url) return;
        bannerurl = url;
        bannerpos = { x: 50, y: 50, zoom: 100 };
        bannerzoom.value = 100;
        refreshbanner();
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        display.textContent = "";
        if (avatarurl && !avatarurl.match(/^https?:\/\/[^"]+$/) && !avatarurl.match(/^\/api\/media\/[^"]+$/))
          return display.textContent = 'Avatar is not a vaild URL';
        if (bannerurl && !bannerurl.match(/^https?:\/\/[^"]+$/) && !bannerurl.match(/^\/api\/media\/[^"]+$/))
          return display.textContent = 'Banner is not a vaild URL';
        const flair = {
          target: flairtarget.value,
          style: flairstyle.value,
          color1: flaircolor1.value,
          color2: flaircolor2.value,
        };
        try {
          const res = await fetch("/api/auth/update", {
            method: "PUT",
            body: JSON.stringify({
              username: name.value,
              biography: bio.value,
              avatar: avatarurl,
              banner: bannerurl,
              mature: mature.checked,
              avatarpos,
              bannerpos,
              flair,
            }),
            headers: { "Content-Type": "application/json" },
          });
          const result = await res.json();
          if (res.status === 400 || res.status === 401) {
            return (display.textContent =
              result.message + ". " + (result.error ? result.error : ""));
          }
          location.assign(`/user/${name.value}`);
        } catch (err) {
          console.error(err.message);
          alert(err.message);
        }
      });
    </script>
  </body>
</html>

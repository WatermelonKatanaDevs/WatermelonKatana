<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #222; color: #fff; font-family: sans-serif; padding: calc(56px + env(safe-area-inset-top)) 12px 12px; text-align: center; }
    #profile-root { max-width: 420px; margin: 0 auto; }
    .status { opacity: .7; font-size: .9rem; padding: 20px 0; }
    .pf-card { background: #2a2a2a; border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 18px; overflow: hidden; }
    .pf-banner { width: 100%; height: 110px; background: #1a1a1a; overflow: hidden; }
    .pf-banner img, .pf-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pf-body { padding: 0 16px 18px; }
    .pf-avatar { width: 84px; height: 84px; border-radius: 50%; overflow: hidden; border: 4px solid #2a2a2a; background: #1a1a1a; margin: -42px auto 0; position: relative; }
    .pf-name { font-size: 1.3rem; font-weight: bold; margin-top: 8px; overflow-wrap: anywhere; }
    .pf-role { font-size: .8rem; color: #00e676; margin-top: 2px; }
    .pf-bio { font-size: .9rem; line-height: 1.45; opacity: .85; margin: 12px 0; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
    .pf-bio a { color: #4facfe; }
    .pf-bio img { max-width: 100%; height: auto; border-radius: 8px; }
    .pf-stats { display: flex; justify-content: space-around; margin: 14px 0; }
    .pf-stats div { display: flex; flex-direction: column; }
    .pf-stats strong { font-size: 1.1rem; }
    .pf-stats span { font-size: .7rem; opacity: .6; }
    .pf-joined { font-size: .75rem; opacity: .55; margin-bottom: 14px; }
    .back-btn { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(40, 40, 40, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; text-decoration: none; z-index: 10; -webkit-tap-highlight-color: transparent; }
    .back-btn:active { background: #3a3a3a; }
    .back-btn svg { width: 24px; height: 24px; }

    .projects-section { margin: 20px auto 0; text-align: left; }
    .projects-section h2 { color: #00e676; font-size: 1.15rem; margin: 0 0 10px; }
    .project-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
      margin-bottom: 18px; text-align: left;
    }
    .project-card {
      display: block; min-width: 0; background: #2a2a2a;
      border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 14px;
      overflow: hidden; color: inherit; text-decoration: none;
      -webkit-tap-highlight-color: transparent; transition: transform .15s ease, background .15s ease;
    }
    .project-card:active { background: #333; transform: scale(0.98); }
    .project-thumb { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #1a1a1a; }
    .project-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .project-card.featured .project-thumb::after {
      content: "Featured"; position: absolute; top: 6px; left: 6px; padding: 2px 8px;
      border-radius: 10px; background: rgba(0, 230, 118, 0.9); color: #111;
      font-size: .65rem; font-weight: bold;
    }
    .project-info { min-width: 0; padding: 9px 11px 11px; }
    .project-title {
      font-size: .9rem; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .project-author {
      font-size: .75rem; color: #00e676; opacity: .85; margin-top: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .project-stats { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .68rem; opacity: .55; margin-top: 7px; }
    .project-status { opacity: .7; font-size: .85rem; margin: 6px 0 12px; text-align: center; }
  </style>
</head>
<body>
<a class="back-btn" href="/" aria-label="Back to home"><i data-lucide="arrow-left"></i></a>
<div id="profile-root"><div class="status">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="/scripts/markdown.js"></script>
<script>
  if (window.lucide) lucide.createIcons();
  const profileRoot = document.getElementById("profile-root");

  // The mobile profile is served at /user/:name, just like the desktop profile.
  function getUsername() {
    const pathParts = window.location.pathname.split("/").filter(Boolean);
    const userIndex = pathParts.indexOf("user");
    if (userIndex === -1 || !pathParts[userIndex + 1]) return "";
    try {
      return decodeURIComponent(pathParts[userIndex + 1]);
    } catch (err) {
      return pathParts[userIndex + 1];
    }
  }

  function pfEsc(str) {
    return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function pfText(str) {
    return typeof window.convertMarkdown === "function" ? window.convertMarkdown(str) : pfEsc(str);
  }

  function pfSafeSrc(url, fallback) {
    return /^(https?:\/\/|\/)/.test(url || "") && !/["'<>]/.test(url) ? url : fallback;
  }

  function pfImg(url, pos, fallback) {
    pos = pos || {};
    const clamp = (v, lo, hi, d) => { v = Number(v); return isFinite(v) ? Math.max(lo, Math.min(hi, v)) : d; };
    const x = clamp(pos.x, 0, 100, 50), y = clamp(pos.y, 0, 100, 50), zoom = clamp(pos.zoom, 100, 400, 100);
    return `<img alt="" src="${pfEsc(pfSafeSrc(url, fallback))}" style="object-position:${x}% ${y}%;transform:scale(${zoom / 100});transform-origin:${x}% ${y}%">`;
  }

  function renderAccount(u) {
    const joined = u.joinedAt ? new Date(Number(u.joinedAt)).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
    const count = a => Array.isArray(a) ? a.length : 0;
    profileRoot.innerHTML = `
      <div class="pf-card">
        <div class="pf-banner">${pfImg(u.banner, u.bannerpos, "/images/default_banner.png")}</div>
        <div class="pf-body">
          <div class="pf-avatar">${pfImg(u.avatar, u.avatarpos, "/images/default_pfp.png")}</div>
          <div class="pf-name">${pfEsc(u.username)}</div>
          <div class="pf-role">${pfEsc(u.role || "")}</div>
          <div class="pf-bio">${pfText(u.biography || "No biography yet.")}</div>
          <div class="pf-stats">
            <div><strong>${count(u.followers)}</strong><span>Followers</span></div>
            <div><strong>${count(u.following)}</strong><span>Following</span></div>
            <div><strong>${count(u.favorites)}</strong><span>Favorites</span></div>
          </div>
          ${joined ? `<div class="pf-joined">Joined ${pfEsc(joined)}</div>` : ""}
        </div>
      </div>`;
  }


  function createProjectCard(project) {
    const card = document.createElement("a");
    card.className = "project-card" + (project.featured ? " featured" : "");
    card.href = "/project/" + encodeURIComponent(project.id);

    const thumb = document.createElement("div");
    thumb.className = "project-thumb";
    const image = document.createElement("img");
    image.alt = "";
    image.loading = "lazy";
    image.draggable = false;
    image.src = pfSafeSrc(project.thumbnail, "/images/blank_project.png");
    image.onerror = () => {
      image.onerror = null;
      image.src = "/images/blank_project.png";
    };
    thumb.appendChild(image);

    const info = document.createElement("div");
    info.className = "project-info";

    const title = document.createElement("div");
    title.className = "project-title";
    title.textContent = project.title || "Untitled";

    const author = document.createElement("div");
    author.className = "project-author";
    author.textContent = "By " + (project.poster || "unknown");

    const stats = document.createElement("div");
    stats.className = "project-stats";
    [["Score", project.score], ["Views", project.views], ["Plays", project.plays]].forEach(([label, value]) => {
      const item = document.createElement("span");
      item.textContent = label + " " + (value ?? 0);
      stats.appendChild(item);
    });

    info.append(title, author, stats);
    card.append(thumb, info);
    return card;
  }

  function createProjectSection(title, id, emptyText) {
    const section = document.createElement("section");
    section.className = "projects-section";
    const heading = document.createElement("h2");
    heading.textContent = title;
    const status = document.createElement("div");
    status.className = "project-status";
    status.textContent = "Loading…";
    const grid = document.createElement("div");
    grid.className = "project-grid";
    grid.id = id;
    section.append(heading, status, grid);
    return { section, status, grid, emptyText };
  }

  async function loadUserProjects(user) {
    const published = createProjectSection("Published Projects", "published-project-grid", "No published projects yet.");
    const favorites = createProjectSection("Favorites", "favorite-project-grid", "No favorites yet.");
    profileRoot.append(published.section, favorites.section);

    let viewer = { mature: false, isOwnProfile: false };
    try {
      const authResponse = await fetch("/api/auth/check");
      if (authResponse.ok) {
        const auth = await authResponse.json();
        viewer.mature = !!auth.user?.mature;
        viewer.isOwnProfile = !!(auth.auth && auth.user &&
          String(auth.user.id) === String(user.id));
      }
    } catch (err) {
      console.warn("Could not check viewer permissions for profile projects", err);
    }

    const params = new URLSearchParams({ poster: user.username });
    if (viewer.mature) params.set("showMature", "true");
    if (viewer.isOwnProfile) params.set("showHidden", "true");

    try {
      const response = await fetch("/api/project/list?" + params.toString());
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      const projects = Array.isArray(data.projects) ? data.projects : [];
      published.status.textContent = projects.length ? "" : published.emptyText;
      projects.forEach(project => published.grid.appendChild(createProjectCard(project)));
      published.status.hidden = projects.length > 0;
    } catch (err) {
      console.error("Could not load published projects", err);
      published.status.textContent = "Couldn't load published projects.";
    }

    const favoriteIds = Array.isArray(user.favorites) ? user.favorites : [];
    const favoriteResults = await Promise.all(favoriteIds.map(async id => {
      try {
        const response = await fetch("/api/project/data/" + encodeURIComponent(id));
        if (!response.ok) return null;
        const project = await response.json();
        if (!project || project.error || (project.mature && !viewer.mature)) return null;
        return project;
      } catch (err) {
        console.warn("Could not load favorite project", id, err);
        return null;
      }
    }));
    const visibleFavorites = favoriteResults.filter(Boolean);
    visibleFavorites.forEach(project => favorites.grid.appendChild(createProjectCard(project)));
    favorites.status.textContent = visibleFavorites.length ? "" : favorites.emptyText;
    favorites.status.hidden = visibleFavorites.length > 0;
  }

 async function loadProfile() {
    const username = getUsername();
    if (!username) {
      profileRoot.innerHTML = '<div class="status">No user specified.</div>';
      return;
    }
    try {
      const res = await fetch("/api/auth/userdata?username=" + encodeURIComponent(username));
      let user = {};
      try { user = await res.json(); } catch (err) {}
      if (!res.ok || !user || user.error || !user.username) {
        profileRoot.innerHTML = '<div class="status">User not found.</div>';
        return;
      }
      document.title = user.username + " | Profile";
      renderAccount(user);
      if (!user.anonymous) await loadUserProjects(user);
    } catch (err) {
      console.error(err);
      profileRoot.innerHTML = '<div class="status">Couldn\u2019t load the profile.</div>';
    }
  }

  loadProfile();
</script>
</body>
</html>

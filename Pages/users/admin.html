<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | WatermelonKatana</title>
    <link rel="stylesheet" type="text/css" href="/styles/style.css">
    <link rel="stylesheet" type="text/css" href="/styles/user.css">
    <script src="/scripts/HtmlSanitizer.js"></script>
    <script src="/scripts/script.js"></script>
    <style>
      .admin-section {
        width: 80%;
        max-width: 900px;
        margin: 20px auto;
      }
      .admin-section h2 {
        background-color: var(--palette-background-item);
        color: var(--palette-textcolor);
        padding: 10px 14px;
        border-radius: 5px;
      }
      .admin-card {
        background: var(--palette-background-card);
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        padding: 14px 16px;
        margin: 12px 0;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .admin-card .grow {
        flex: 1;
        min-width: 180px;
      }
      .admin-card .card-name {
        font-weight: bold;
        font-size: 1.1em;
      }
      .admin-card .card-meta {
        font-size: 0.85em;
        color: var(--palette-text-viewed);
      }
      .admin-card .card-content {
        margin: 4px 0;
      }
      .report-link {
        word-break: break-all;
        font-size: 0.9em;
      }
      #status {
        width: 80%;
        max-width: 900px;
        margin: 10px auto 0;
        color: var(--palette-delete-button);
        font-weight: bold;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <script src="/scripts/navbar.js"></script>

    <div id="status"></div>

    <div class="admin-section">
      <h2>Users</h2>
      <input type="text" id="user-search" placeholder="Search users by name..." style="width: 100%; margin-bottom: 10px;">
      <div id="userlist"></div>
    </div>

    <div class="admin-section">
      <h2>Content Tools</h2>
      <div class="admin-card">
        <input type="text" id="content-link" class="grow" placeholder="Project or post link / ID">
        <select id="content-type">
          <option value="project">Project</option>
          <option value="forum">Forum post</option>
        </select>
        <button id="feature-btn">Feature</button>
        <button id="unfeature-btn">Unfeature</button>
        <button id="content-delete-btn" class="delete">Delete</button>
      </div>
    </div>

    <div class="admin-section">
      <h2>Reports</h2>
      <div id="reportlist"></div>
    </div>

    <script>
      const roles = ["Basic", "Moderator", "Admin", "Uni Lover"];
      const status = document.querySelector("#status");
      const userlist = document.querySelector("#userlist");
      const reportlist = document.querySelector("#reportlist");

      function seterror(message) {
        status.textContent = message ? "Error: " + message : "";
      }

      async function apicall(url, options) {
        const res = await fetch(url, options);
        let body = {};
        try { body = await res.json(); } catch (e) {}
        if (!res.ok) throw new Error(body.message || ("Request failed (" + res.status + ")"));
        return body;
      }

      function rolepicker(user) {
        const select = document.createElement("select");
        const options = roles.includes(user.role) ? roles : [user.role].concat(roles);
        for (const r of options) {
          const option = document.createElement("option");
          option.value = r;
          option.textContent = r;
          if (r === user.role) option.selected = true;
          select.appendChild(option);
        }
        select.addEventListener("change", async () => {
          try {
            await apicall("/api/auth/updateRole", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ role: select.value, id: user.id })
            });
            seterror("");
          } catch (err) {
            seterror(err.message);
            loadusers();
          }
        });
        return select;
      }

      function usercard(user) {
        const card = document.createElement("div");
        card.className = "admin-card";

        const avatar = document.createElement("span");
        avatar.className = "comment-avatar";
        avatar.innerHTML = focalimg(user.avatar || "/images/default_pfp.png", user.avatarpos);
        card.appendChild(avatar);

        const info = document.createElement("div");
        info.className = "grow";
        const name = document.createElement("a");
        name.className = "card-name";
        name.href = "/user/" + user.username;
        name.textContent = "@" + user.username;
        const meta = document.createElement("div");
        meta.className = "card-meta";
        meta.textContent = (user.verified ? "Verified" : "Unverified") + " · Joined " + new Date(user.joinedAt).toLocaleDateString();
        info.appendChild(name);
        info.appendChild(document.createElement("br"));
        info.appendChild(meta);
        card.appendChild(info);

        card.appendChild(rolepicker(user));

        const resetbtn = document.createElement("button");
        resetbtn.textContent = "Reset Password";
        resetbtn.addEventListener("click", async () => {
          const password = prompt("New password for @" + user.username + " (min 8 chars):");
          if (!password) return;
          if (password.length < 8) { seterror("Password must be at least 8 characters"); return; }
          try {
            await apicall("/api/admin/resetpassword?uid=" + encodeURIComponent(user.id) + "&password=" + encodeURIComponent(password));
            seterror("");
            alert("Password reset for @" + user.username);
          } catch (err) {
            seterror(err.message);
          }
        });
        card.appendChild(resetbtn);

        const deletebtn = document.createElement("button");
        deletebtn.className = "delete";
        deletebtn.textContent = "Delete";
        deletebtn.addEventListener("click", async () => {
          if (!confirm("Permanently delete @" + user.username + "? This cannot be undone.")) return;
          try {
            await apicall("/api/auth/deleteUser", {
              method: "DELETE",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: user.id })
            });
            loadusers();
          } catch (err) {
            seterror(err.message);
          }
        });
        card.appendChild(deletebtn);

        return card;
      }

      let allusers = [];
      function renderusers() {
        const q = (document.querySelector("#user-search").value || "").toLowerCase();
        userlist.innerHTML = "";
        for (const user of allusers) {
          if (user.username === "admin") continue;
          if (q && !user.username.toLowerCase().includes(q)) continue;
          userlist.appendChild(usercard(user));
        }
      }

      async function loadusers() {
        try {
          const data = await apicall("/api/auth/listUsers");
          allusers = data.user || [];
          renderusers();
        } catch (err) {
          seterror(err.message);
        }
      }

      document.querySelector("#user-search").addEventListener("input", renderusers);

      function parsecontentid(input) {
        const m = String(input || "").match(/[a-f0-9]{24}/i);
        return m ? m[0] : null;
      }

      async function contentaction(action) {
        const type = document.querySelector("#content-type").value;
        const id = parsecontentid(document.querySelector("#content-link").value);
        if (!id) return seterror("Enter a valid project/post link or ID");
        try {
          if (action === "delete") {
            if (!confirm("Delete this " + type + "?")) return;
            await apicall("/api/" + type + "/delete/" + id, { method: "DELETE" });
          } else {
            await apicall("/api/" + type + "/" + action + "/" + id);
          }
          seterror("");
          alert(action.charAt(0).toUpperCase() + action.slice(1) + " successful");
        } catch (err) {
          seterror(err.message);
        }
      }

      document.querySelector("#feature-btn").addEventListener("click", () => contentaction("feature"));
      document.querySelector("#unfeature-btn").addEventListener("click", () => contentaction("unfeature"));
      document.querySelector("#content-delete-btn").addEventListener("click", () => contentaction("delete"));

      function reportcard(report) {
        const card = document.createElement("div");
        card.className = "admin-card";

        const info = document.createElement("div");
        info.className = "grow";
        const who = document.createElement("div");
        who.className = "card-meta";
        who.textContent = "By @" + report.poster + " · " + new Date(report.postedAt).toLocaleString();
        const content = document.createElement("div");
        content.className = "card-content";
        content.textContent = report.content;
        const link = document.createElement("a");
        link.className = "report-link";
        link.href = report.link;
        link.textContent = report.link;
        info.appendChild(who);
        info.appendChild(content);
        info.appendChild(link);
        card.appendChild(info);

        const openbtn = document.createElement("a");
        openbtn.className = "button";
        openbtn.href = "/report/" + report.id;
        openbtn.textContent = "Resolve & Open";
        card.appendChild(openbtn);
        return card;
      }

      async function loadreports() {
        try {
          const data = await apicall("/api/admin/reports/list");
          reportlist.innerHTML = "";
          if (!data.report || data.report.length === 0) {
            reportlist.textContent = "No open reports.";
            return;
          }
          for (const report of data.report) reportlist.appendChild(reportcard(report));
        } catch (err) {
          seterror(err.message);
        }
      }

      loadusers();
      loadreports();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Editor | WatermelonKatana</title>
  <link rel="stylesheet" type="text/css" href="/styles/style.css">
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    #editorFrame { position:fixed; top:2.5em; left:0; width:100vw; height:calc(100vh - 2.5em); border:0; display:block; }
    .editor-exit { position:fixed; right:20px; bottom:20px; z-index:1100; padding:10px 18px; border-radius:999px; text-decoration:none; background:var(--palette-button-tint,#333); color:var(--palette-button-textcolor,#fff); box-shadow:0 4px 14px rgba(0,0,0,.25); font-weight:bold; }
  </style>
</head>
<body>
  <script src="/scripts/script.js"></script>
  <script src="/scripts/navbar.js"></script>
  <iframe id="editorFrame" src="EDITOR_SRC" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  <a class="editor-exit" href="EXIT_URL">Exit</a>
</body>
</html>

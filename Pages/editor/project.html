
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Editor | WatermelonKatana</title>
  <link rel="stylesheet" type="text/css" href="/styles/style.css">
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    #editorFrame { position:fixed; top:2.5em; left:0; width:100vw; height:calc(100vh - 2.5em); border:0; display:block; }
  </style>
</head>
<body>
  <script src="/scripts/script.js"></script>
  <script src="/scripts/navbar.js"></script>
  <iframe id="editorFrame" src="EDITOR_SRC" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  <script>
    const frame = document.getElementById("editorFrame");
    frame.addEventListener('load',function(){
      const framedoc = frame.contentDocument;
      framedoc.getElementsByClassName("toolbar-left")[0].innerHTML = `<button onclick="window.top.location.href='EXIT_URL'">Exit</Button>`;
      framedoc.getElementById("saveProjectBtn").outerHTML = '';
      framedoc.getElementById("saveZipBtn").outerHTML = '';
      
      var old = frame.contentWindow.__sharedBrowserNetwork._requestObject;
      frame.contentWindow.__sharedBrowserNetwork._requestObject = function(request, ...args) {
        if (!request.url.startsWith(window.origin)) return old.call(this, request, ...args);
        const newHeaders = new request.headers.constructor(request.headers);
        newHeaders.append('X-From-Emulator', '1');
        const modifiedRequest = new request.constructor(request, {
          headers: newHeaders
        });
        return old.call(this, modifiedRequest, ...args);
      };
      
      var style = framedoc.createElement('style');
      style.innerHTML = `
  /* WatermelonKatana-inspired accent skin for Node Editor. Add AFTER existing styles. */
:root{--wk-pink:rgb(221,109,127);--wk-pink-soft:rgba(221,109,127,.18);--wk-pink-faint:rgba(221,109,127,.08);--wk-green:rgb(60,223,169);--wk-green-hover:rgb(82,232,181);--wk-green-soft:rgba(60,223,169,.16);}

/* Pink = structure, borders, edges */
.border-indigo-500,.border-indigo-600{border-color:var(--wk-pink)!important}
.border-gray-500,.border-gray-600,.border-gray-700{border-color:rgba(221,109,127,.38)!important}
.modal-box,.modal-content,.dialog,.card,.panel,.welcome-card,.project-card{border-color:rgba(221,109,127,.38)!important}
.tab.active,.editor-tab.active,.tab[aria-selected="true"],.editor-tab[aria-selected="true"]{border-bottom-color:var(--wk-pink)!important}
.resizer:hover,.resize-handle:hover,.splitter:hover{background:var(--wk-pink)!important}

/* Green = actions and interactive accents */
button.bg-indigo-600,button.bg-indigo-500,.bg-indigo-600,.bg-indigo-500{background:var(--wk-green)!important;border-color:var(--wk-green)!important;color:#101512!important}
button.bg-indigo-600:hover,button.bg-indigo-500:hover{background:var(--wk-green-hover)!important;border-color:var(--wk-green-hover)!important}
input:focus,select:focus,textarea:focus{border-color:var(--wk-green)!important;box-shadow:0 0 0 2px var(--wk-green-soft)!important}

/* Selected UI */
.explorer .selected,.file-explorer .selected,.explorer [aria-selected="true"],.file-explorer [aria-selected="true"]{background:var(--wk-green-soft)!important;color:var(--wk-green)!important}
.explorer .selected::before,.file-explorer .selected::before{background:var(--wk-green)!important}

/* Replace blue/indigo text accents */
.text-indigo-300,.text-indigo-400,.text-indigo-500,.text-indigo-600{color:var(--wk-green)!important}
.modal-box h1,.modal-box h2,.modal-box h3,.modal-content h1,.modal-content h2,.modal-content h3,.dialog h1,.dialog h2,.dialog h3{color:var(--wk-pink)!important}
a{color:var(--wk-green)!important}a:hover{color:var(--wk-green-hover)!important}

/* Pink hover outlines */
button:hover:not(:disabled){border-color:rgba(221,109,127,.65) !important; background:rgba(221,109,127,.33) !important;}
button.bg-indigo-600:hover,button.bg-indigo-500:hover{border-color:var(--wk-green-hover)!important}

.workbench-tab:hover {background:rgba(221,109,127,.33) !important;}

/* Keep controls dark */
input,select,textarea{background:#202124!important;color:#e5e7eb!important}
.address-bar,.browser-address{border-color:rgba(221,109,127,.45)!important}
.browser-tab.active{border-color:var(--wk-pink)!important}
.browser-tab.active::after{background:var(--wk-green)!important}

/* Menus */
.menu,.dropdown-menu,.context-menu,[role="menu"]{border-color:rgba(221,109,127,.42)!important}
.menu-item:hover,.dropdown-item:hover,.context-menu-item:hover,[role="menuitem"]:hover{background:var(--wk-green-soft)!important}

/* Terminal keeps its dark look, with a subtle pink edge */
.terminal,.console,#terminal,#console,.terminal-container,.console-container{border-color:rgba(221,109,127,.35)!important}
::selection{background:rgba(221,109,127,.35);color:white}

/* Common Tailwind indigo replacements */
.bg-indigo-50,.bg-indigo-100,.bg-indigo-200{background:var(--wk-green-soft)!important}
.bg-indigo-600,.bg-indigo-500{background:var(--wk-green)!important}
.border-indigo-300,.border-indigo-400{border-color:var(--wk-pink)!important}
.ring-indigo-500,.focus\:ring-indigo-500:focus{--tw-ring-color:var(--wk-green)!important}

#statusBar { background-color: #00d18f; }
button.primary { background: #08a372 !important;; border-color: #00d18f !important;; }
button.primary:hover:not(:disabled) { background: #02db97 !important;; border-color: #00d18f !important; }

.welcome-group-create button { background: #08a372 !important;; border-color: #00d18f !important;; }
.welcome-group-create button:hover:not(:disabled) { background: #02db97 !important;; border-color: #00d18f !important; }

.source-control-commit { background: #08a372 !important;; border-color: #00d18f !important;; }
.source-control-commit:hover:not(:disabled) { background: #02db97 !important;; border-color: #00d18f !important; }

#tree li.selected-file { background: #003314; }
#tree li.selected-file:hover:not(:has(li:hover)) { background: #014d1e; }
      `;
      framedoc.body.appendChild(style);
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Project</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #deploymentFrame { position:fixed; inset:0; width:100vw; height:100vh; border:0; display:block; }
  </style>
</head>
<body>
  <script src="BRIDGE_SRC"></script>
  <iframe id="deploymentFrame" src="DEPLOYMENT_SRC" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  <script>
    const frame = document.getElementById('deploymentFrame');
    let expectedOrigin = '';
    try { expectedOrigin = new URL(frame.src).origin; } catch (_) {}

    window.addEventListener('message', event => {
      if (event.source !== frame.contentWindow || event.origin !== expectedOrigin) return;
      const data = event.data;
      if (!data || data.type !== 'wk-deployment-metadata') return;
      if (typeof data.title === 'string' && data.title) document.title = data.title;
      if (typeof data.icon === 'string' && data.icon) {
        let icon = document.querySelector('link[data-emulated-favicon="1"]');
        if (!icon) {
          icon = document.createElement('link');
          icon.rel = 'icon';
          icon.dataset.emulatedFavicon = '1';
          document.head.appendChild(icon);
        }
        icon.href = data.icon;
      }
    });

    const host = {
      async fetch(input, options = {}) {
        const target = new URL(String(input), window.location.href);
        if (target.origin !== window.location.origin ||
            !(target.pathname.startsWith('/api/') || target.pathname.startsWith('/datablock_storage/'))) {
          throw new Error('The deployment host bridge only permits same-origin API and datablock storage requests.');
        }
        const method = String(options.method || 'GET').toUpperCase();
        const headers = new Headers(options.headers || []);
        if (target.pathname.startsWith('/api/')) headers.set('X-From-Emulator', '1');
        const response = await window.fetch(target.href, {
          method,
          headers,
          body: ['GET','HEAD'].includes(method) ? undefined : (typeof options.body === 'string' ? options.body : undefined),
          credentials: 'same-origin',
          cache: 'no-store'
        });
        return {
          ok: response.ok,
          status: response.status,
          statusText: response.statusText,
          headers: Array.from(response.headers.entries()),
          body: [204,205,304].includes(response.status) ? '' : await response.text()
        };
      }
    };

    frame.addEventListener('load', async () => {
      try {
        window.__wkDeploymentBridge?.close?.();
        window.__wkDeploymentBridge = await window.EditorRemoteBridge.connect(frame.contentWindow, {
          targetOrigin: expectedOrigin,
          localObjects: {EditorHost: host},
          config: {origin: window.location.origin},
          timeout: 15000
        });
      } catch (error) {
        console.error('Unable to connect deployment host bridge:', error);
      }
    });
  </script>
</body>
</html>

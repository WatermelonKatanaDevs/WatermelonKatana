<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Project</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #deploymentFrame { position:fixed; inset:0; width:100vw; height:100vh; border:0; display:block; }
  </style>
</head>
<body>
  <iframe id="deploymentFrame" src="DEPLOYMENT_SRC" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  <script>
    const frame = document.getElementById("deploymentFrame");
    var wait = t => new Promise(r => setTimeout(r, t));
    function syncEmulatedMetadata() {
      const doc = frame?.contentDocument;
      if (!doc) return;

      if (doc.title) document.title = doc.title;

      let icon = doc.querySelector(
        'link[rel~="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]'
      );

      if (icon?.href) {
        let href;
        try {
          href = new URL(icon.getAttribute("href"), doc.baseURI).href;
        } catch {
          href = icon.href;
        }

        if (href) {
          let ownIcon = document.querySelector('link[data-emulated-favicon="1"]');
          if (!ownIcon) {
            ownIcon = document.createElement("link");
            ownIcon.rel = "icon";
            ownIcon.dataset.emulatedFavicon = "1";
            document.head.appendChild(ownIcon);
          }
          ownIcon.href = href;
        }
      }
    }

    frame.addEventListener('load', async () => {
      while (!frame?.contentWindow?.__deploymentNetworkReady?._requestObject) await wait(1);

      syncEmulatedMetadata();

      const doc = frame.contentDocument;
      if (doc) {
        const observer = new MutationObserver(syncEmulatedMetadata);
        observer.observe(doc.head || doc.documentElement, {
          subtree: true,
          childList: true,
          attributes: true,
          attributeFilter: ["href", "rel"]
        });

        const title = doc.querySelector("title");
        if (title) {
          observer.observe(title, {
            subtree: true,
            childList: true,
            characterData: true
          });
        }
      }

      var old = frame.contentWindow.__deploymentNetworkReady._requestObject;
      frame.contentWindow.__deploymentNetworkReady._requestObject = function(request, ...args) {
        if (!request.url.startsWith(window.origin)) return old.call(this, request, ...args);
        const newHeaders = new request.headers.constructor(request.headers);
        newHeaders.append('X-From-Emulator', '1');
        const modifiedRequest = new request.constructor(request, {
          headers: newHeaders
        });
        return old.call(this, modifiedRequest, ...args);
      };
    });
  </script>
</body>
</html>

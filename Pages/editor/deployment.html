<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Project</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #deploymentFrame { position:fixed; inset:0; width:100vw; height:100vh; border:0; display:block; }
  </style>
</head>
<body>
  <iframe id="deploymentFrame" src="DEPLOYMENT_SRC" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  <script>
    const frame = document.getElementById('deploymentFrame');
    let expectedOrigin = '';
    try { expectedOrigin = new URL(frame.src).origin; } catch (_) {}

    window.addEventListener('message', event => {
      if (event.source !== frame.contentWindow || event.origin !== expectedOrigin) return;
      const data = event.data;
      if (!data || data.type !== 'wk-deployment-metadata') return;

      if (typeof data.title === 'string' && data.title) document.title = data.title;
      if (typeof data.icon === 'string' && data.icon) {
        let icon = document.querySelector('link[data-emulated-favicon="1"]');
        if (!icon) {
          icon = document.createElement('link');
          icon.rel = 'icon';
          icon.dataset.emulatedFavicon = '1';
          document.head.appendChild(icon);
        }
        icon.href = data.icon;
      }
    });
  </script>
</body>
</html>

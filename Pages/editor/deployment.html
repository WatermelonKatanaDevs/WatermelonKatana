<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Project</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #deploymentFrame { position:fixed; inset:0; width:100vw; height:100vh; border:0; display:block; }
  </style>
</head>
<body>
  <iframe id="deploymentFrame" src="DEPLOYMENT_SRC" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  <script>
    const frame = document.getElementById("deploymentFrame");
    var wait = t => new Promise(r => setTimeout(r, t));
    frame.addEventListener('load', async () => {
      // The deployment iframe can navigate to a third-party origin (for example
      // GitHub). Once that happens, its Window is cross-origin and must not be
      // inspected by the parent page.
      try {
        while (true) {
          let deploymentWindow;
          try {
            deploymentWindow = frame.contentWindow;
            if (!deploymentWindow || deploymentWindow.location.origin !== window.location.origin) return;
            if (deploymentWindow.__deploymentNetworkReady?._requestObject) break;
          } catch (_) {
            return;
          }
          await wait(1);
        }

        const deploymentWindow = frame.contentWindow;
        const networkReady = deploymentWindow.__deploymentNetworkReady;
        const old = networkReady?._requestObject;
        if (typeof old !== 'function') return;

        networkReady._requestObject = function(request, ...args) {
          try {
            if (!request.url.startsWith(window.origin)) return old.call(this, request, ...args);
            const newHeaders = new request.headers.constructor(request.headers);
            newHeaders.append('X-From-Emulator', '1');
            const modifiedRequest = new request.constructor(request, {
              headers: newHeaders
            });
            return old.call(this, modifiedRequest, ...args);
          } catch (_) {
            return old.call(this, request, ...args);
          }
        };
      } catch (_) {
        // Navigation may have crossed origins; nothing needs patching.
      }
    });
  </script>
</body>
</html>

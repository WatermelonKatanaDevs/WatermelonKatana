<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Editor | WatermelonKatana</title>
  <link rel="stylesheet" type="text/css" href="/styles/style.css">
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    #editorFrame { position:fixed; top:2.5em; left:0; width:100vw; height:calc(100vh - 2.5em); border:0; display:block; }
    #editorBridgeError { position:fixed; inset:2.5em 0 0; display:none; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; background:#181818; color:#eee; font:14px system-ui,sans-serif; white-space:pre-wrap; text-align:center; z-index:10; }
  </style>
  <script src="/scripts/markdown.js"></script>
  <script src="/scripts/script.js"></script>
  <script src="/scripts/navbar.js"></script>
  <script src="BRIDGE_SRC"></script>
</head>
<body>
  <iframe id="editorFrame" src="EDITOR_SRC" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  <div id="editorBridgeError" role="alert"></div>
  <script>
    (function() {
      const frame = document.getElementById('editorFrame');
      const errorPanel = document.getElementById('editorBridgeError');
      const editorOrigin = new URL(frame.src).origin;

      const host = {
        async getAuth() {
          if (typeof window.getAuth !== 'function') return null;
          return await window.getAuth();
        },
        async fetch(input, options = {}) {
          const url = new URL(String(input), window.location.href);
          if (url.origin !== window.location.origin) {
            throw new Error('The Editor host bridge only permits requests to the WatermelonKatana origin.');
          }
          const headers = new Headers(options.headers || {});
          let body = options.body;
          if (body && body.__wkFormData === true && Array.isArray(body.entries)) {
            const form = new FormData();
            for (const entry of body.entries) {
              if (Array.isArray(entry) && entry.length >= 2) form.append(String(entry[0]), entry[1]);
            }
            body = form;
            headers.delete('Content-Type');
          }
          const response = await window.fetch(url.href, {
            ...options,
            headers,
            body,
            credentials: 'same-origin'
          });
          return {
            ok: response.ok,
            status: response.status,
            statusText: response.statusText,
            headers: Array.from(response.headers.entries()),
            body: await response.text()
          };
        },
        navigate(destination) {
          const url = new URL(String(destination), window.location.href);
          if (url.origin !== window.location.origin) {
            throw new Error('The Editor host bridge only permits same-origin navigation.');
          }
          window.location.assign(url.href);
        }
      };

      frame.addEventListener('load', async () => {
        errorPanel.style.display = 'none';
        try {
          window.__wkEditorBridge?.close?.();
          const bridge = await window.EditorRemoteBridge.connect(frame.contentWindow, {
            targetOrigin: editorOrigin,
            localObjects: {WKHost: host},
            config: {
              origin: window.location.origin,
              hostUrl: window.location.href,
              integrationUrl: new URL('/editor-integration.js', window.location.origin).href
            },
            timeout: 15000
          });
          window.__wkEditorBridge = bridge;
          window.dispatchEvent(new CustomEvent('wkeditorready', {detail:{bridge}}));
        } catch (error) {
          console.error('Unable to connect to the WatermelonKatana editor:', error);
          errorPanel.textContent = 'Unable to connect to the Editor.\n\n' + (error?.message || String(error));
          errorPanel.style.display = 'flex';
        }
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preferences | WatermelonKatana</title>
  <link rel="stylesheet" type="text/css" href="/styles/style.css">
  <link rel="stylesheet" type="text/css" href="/styles/error.css">
  <script src="/scripts/HtmlSanitizer.js"></script>
  <script src="/scripts/script.js"></script>
  <style>
    .config {
      display: flex;
      align-items: center;
    }
    .config div {
      margin: 20px;
    }
    .config h3 {
      max-width: 50vw;
      text-align: left;
    }
  </style>
</head>

<body>
  <script src="/scripts/navbar.js"></script>
  <h1> Configuration Preferences </h1>
  <div class="config">
    <h3>Choose Your Color Scheme:</h3>

    <div>
      <button onclick="updateColorScheme('light')">Light Mode</button>
      <button onclick="updateColorScheme('dark')">Dark Mode</button>
    </div>
  </div>
  <div class="config">
    <h3>Choose Your Cursor:</h3>

    <div>
      <button onclick="updateCursorScheme('none')">None</button>
      <button onclick="updateCursorScheme('default')">Default</button>
    </div>
  </div>
  <div class="config">
    <h3>Signed-in banner background:</h3>

    <div>
      <label>
        <input type="checkbox" id="signedin-banner-toggle" onchange="setsignedinbanner(this.checked)">
        <span class="checkbox"></span>
      </label>
    </div>
  </div>
  <div class="config">
    <h3>User hover previews:</h3>

    <div>
      <label>
        <input type="checkbox" id="user-preview-toggle" onchange="localStorage.setItem('user-preview', this.checked ? 'on' : 'off')">
        <span class="checkbox"></span>
      </label>
    </div>
  </div>
  <script>
    let currentuser = null;
    const signedinbannertoggle = document.querySelector("#signedin-banner-toggle");
    document.querySelector("#user-preview-toggle").checked = localStorage.getItem("user-preview") !== "off";
    (async () => {
      const data = await getAuth();
      currentuser = data.user;
      if (currentuser) signedinbannertoggle.checked = !!currentuser.signedinbanner;
    })();

    async function setsignedinbanner(value) {
      if (!currentuser) return alert("Not signed in!");
      await fetch("/api/auth/update", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: currentuser.username,
          biography: currentuser.biography,
          avatar: currentuser.avatar,
          banner: currentuser.banner,
          mature: currentuser.mature,
          avatarpos: currentuser.avatarpos,
          bannerpos: currentuser.bannerpos,
          flair: currentuser.flair,
          signedinbanner: value,
        }),
      });
      currentuser.signedinbanner = value;
    }
  </script>
  <!-- <div id="footer"> -->
  </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preferences | WatermelonKatana</title>
  <link rel="stylesheet" type="text/css" href="/styles/style.css">
  <link rel="stylesheet" type="text/css" href="/styles/error.css">
  <script src="/scripts/HtmlSanitizer.js"></script>
  <script src="/scripts/script.js"></script>
  <style>
    .config {
      display: flex;
      align-items: center;
    }
    .config div {
      margin: 20px;
    }
    .config h3 {
      max-width: 50vw;
      text-align: left;
    }
  </style>
</head>

<body>
  <script src="/scripts/navbar.js"></script>
  <h1> Configuration Preferences </h1>
  <div class="config">
    <h3>Choose Your Color Scheme:</h3>

    <div>
      <button onclick="updateColorScheme('light')">Light Mode</button>
      <button onclick="updateColorScheme('dark')">Dark Mode</button>
    </div>
  </div>
  <div class="config">
    <h3>Choose Your Cursor:</h3>

    <div>
      <button onclick="updateCursorScheme('none')">None</button>
      <button onclick="updateCursorScheme('default')">Default</button>
    </div>
  </div>
  <div class="config">
    <h3>Signed-in banner background:</h3>

    <div>
      <label>
        <input type="checkbox" id="signedin-banner-toggle" onchange="setsignedinbanner(this.checked)">
        <span class="checkbox"></span>
      </label>
    </div>
  </div>
  <div class="config">
    <h3>User hover previews:</h3>

    <div>
      <label>
        <input type="checkbox" id="user-preview-toggle" onchange="localStorage.setItem('user-preview', this.checked ? 'on' : 'off')">
        <span class="checkbox"></span>
      </label>
    </div>
  </div>
  <div class="config">
    <h3>Allow projects to access your data (name, avatar, banner, role):</h3>

    <div>
      <label>
        <input type="checkbox" id="allow-userdata-toggle" onchange="savepref('allowuserdata', this.checked)">
        <span class="checkbox"></span>
      </label>
    </div>
  </div>
  <script>
    let currentuser = null;
    document.querySelector("#user-preview-toggle").checked = localStorage.getItem("user-preview") !== "off";
    (async () => {
      const data = await getAuth();
      currentuser = data.user;
      if (currentuser) {
        document.querySelector("#signedin-banner-toggle").checked = !!currentuser.signedinbanner;
        document.querySelector("#allow-userdata-toggle").checked = !!currentuser.allowuserdata;
      }
    })();

    async function savepref(key, value) {
      if (!currentuser) return alert("Not signed in!");
      const body = {
        username: currentuser.username,
        biography: currentuser.biography,
        avatar: currentuser.avatar,
        banner: currentuser.banner,
        mature: currentuser.mature,
        avatarpos: currentuser.avatarpos,
        bannerpos: currentuser.bannerpos,
        flair: currentuser.flair,
      };
      body[key] = value;
      await fetch("/api/auth/update", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      currentuser[key] = value;
    }

    function setsignedinbanner(value) { savepref("signedinbanner", value); }
  </script>
  <!-- <div id="footer"> -->
  </div>
</body>

</html>
